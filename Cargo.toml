# Continuum Cargo workspace.
#
# The member list is plan §20 ("Crate and service architecture"), expanded
# exactly: `continuum-effects-{network,storage,time,process}` is four crates.
# There is deliberately no `continuum-protocol` crate — the native protocol
# lives in `continuumd` (notes/plan/notes/START_HERE_IMPLEMENTATION.md,
# "Dependency islands").
#
# Dependency edges are declared only where the plan states them outright. A
# missing edge is cheap to add later; a wrong edge is architectural debt.
# `tools/check_crate_boundaries.py` enforces the forbidden edges mechanically
# and is wired into `just check`.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# Matches the `edition = "2024"` floor. This is a *minimum* compatibility
# statement, not a pin: the exact toolchain identity lives in
# `rust-toolchain.toml` (PR-1 / IMPL-05, plan §20's reproducible-build
# covenant and INV-014).
rust-version = "1.85"
# Product license, decided in PR 0 (plan §21.1) and recorded in
# notes/plan/adr/0053-product-license-mit-or-apache-2.md: the Rust-ecosystem
# dual grant, so a recipient elects MIT (GPLv2-compatible) or Apache-2.0 (express
# patent grant). Texts are `LICENSE-MIT` and `LICENSE-APACHE` at the repo root.
# This is Continuum's *outbound* grant only; it does not and cannot strip the
# `LicenseRef-MIT-OpenAI-Anthropic-Rider` that asupersync's pass-through clause
# attaches to any binary linking it (ADR-0001, ADR-0053 D0, README "License").
# Crates keep `publish = false` until the project decides to publish; that is a
# release decision, not a licensing one.
license = "MIT OR Apache-2.0"

# Workspace-wide lint defaults. Each crate opts in with `[lints] workspace =
# true`, so this table is the single place to add project-wide policy —
# including the `#![forbid(unsafe_code)]` rollout owned by PR-1 / IMPL-04.
#
# `unsafe_code = "forbid"` applies to every workspace crate with no
# exceptions. Plan §20's dependency rules only spell out an explicit
# no-unsafe constraint for the `continuum-kernel-*` trusted checking base;
# neither §20 nor docs/03_ASSURANCE_AND_TCB.md ("`#![forbid(unsafe_code)]`",
# the checker-architecture bullet) nor docs/12_GOVERNANCE_AND_ENGINEERING.md
# ("`unsafe` forbidden by default") reserves unsafe for
# `continuum-asupersync` or the `continuum-effects-*` boundary crates in
# Revision 3. (An earlier revision — notes/plan/archive/plan-revision-2.md
# §16.2 — allowed justified unsafe in "boundary crates"; that carve-out was
# not carried forward into the Revision 3 plan or START_HERE_IMPLEMENTATION.md
# and this workspace targets Revision 3.) Until the dossier is amended to
# name a specific crate, no crate-level override exists.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

# --- Determinism-relevant profile settings (PR-1 / IMPL-05) ---------------
#
# Only settings the dossier actually requires appear here. Nothing below is a
# performance knob, and no flag is set without a citation.
#
# `overflow-checks`: docs/19_TEST_STRATEGY.md §7 ("Determinism matrix") makes
# `debug/release` one of the dimensions every retained scenario is tested over,
# and requires that "Semantic artifacts must be identical or differences must
# be explicitly non-semantic and normalized away". Cargo's default release
# profile breaks that: integer overflow panics in `dev` and wraps silently in
# `release`, so the same scenario can produce two different semantic artifacts
# and the release one looks successful. docs/12 §11 classes "semantic digest
# nondeterminism" as a release blocker, and docs/12 §4 requires "no unchecked
# optimization" of kernel changes. Turning the checks on in release makes the
# arithmetic agree across the matrix dimension.
#
# `debug-assertions` is deliberately left at its default. A `debug_assert!`
# that fires is a *detected* divergence — a panic naming its own cause — while
# a silently wrapped integer is an undetected wrong answer. Only the second
# kind produces a misleading artifact, so only the second kind is corrected
# here.
#
# Path trimming is NOT set here, and the omission is deliberate. Plan §20
# requires that "kernel crates build reproducibly from pinned sources" so the
# "build digest and toolchain identity" a receipt records (INV-014) stay
# "independently re-derivable", and absolute build-directory paths embedded in
# object code defeat that by making the digest a function of *where* the build
# ran. The Cargo setting that fixes it — `profile.release.trim-paths` — is
# still unstable in the pinned toolchain (Cargo 1.97.0: "the package requires
# the Cargo feature called `trim-paths`, but that feature is not stabilized"),
# and a nightly-gated flag is not a build policy. Bit-identical kernel builds
# are PR 9's covenant tooling, not this scaffold's claim; when `trim-paths`
# stabilizes, or PR 9 needs it sooner, it belongs here with that citation.
[profile.release]
overflow-checks = true
