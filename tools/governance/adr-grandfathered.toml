# Grandfather allowlist for GOV §2 ADR-process checks (bn-29gc, bn-xjz8).
#
# tools/governance/check_adr_process.py enforces docs/12_GOVERNANCE_AND_ENGINEERING.md
# §2: every ADR's status must be a member of the closed five-value set, and every
# ADR must carry all nine required sections. Most of the 53 real ADRs under
# notes/plan/adr/*.md predate that nine-section discipline (only ADR-0053 is
# fully compliant as scanned), so a mechanical, honest check needs an explicit,
# per-ADR, per-section exemption list rather than a blanket pass.
#
# Each [[grandfathered]] entry below names one pre-existing ADR file and the
# exact set of required sections (by canonical key) it is missing. The checker:
#   - exempts exactly the (adr, section) pairs listed here from failure;
#   - still fails a grandfathered ADR for any OTHER missing section not named
#     in its entry, or for a status outside the closed set;
#   - fails the run if an entry names a section that is not actually missing
#     (a stale/overly broad exemption) or names an ADR file that does not exist;
#   - grants no exemption at all to any ADR file not listed here, so a new ADR
#     must be fully compliant from the day it lands.
#
# Canonical section keys (docs/12 §2's nine required sections, in the order the
# script checks them, GOV-2-06..14): context, decision, formal_consequences,
# alternatives, compatibility, security, performance_hypothesis, validation_plan,
# rollback.
#
# `formal_consequences` matches a plain "## Consequences" heading (the house
# style; no real ADR spells out "Formal consequences"). `alternatives` matches
# any heading containing the word "alternative(s)" (e.g. "Alternatives
# considered", "Rejected alternatives"). `validation_plan` and `rollback` each
# also match a combined "## Validation and rollback" heading, which the house
# style used through ADR-0029/0053 to satisfy both at once.
#
# Populated 2026-07-31 by a full scan of notes/plan/adr/*.md (53 real ADRs,
# README.md excluded) at the commit implementing bn-29gc/bn-xjz8. Re-run
# `python3 tools/governance/check_adr_process.py` after adding or editing an
# ADR; a newly honest ADR should have entries removed here, not added to.
#
# Grandfathered ADR count: 52 of 53 (only ADR-0053 needs no exemption).

