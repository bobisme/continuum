# Dependency rationale and TCB classification.
#
#   dependency additions require rationale and TCB classification.
#     — notes/plan/docs/12_GOVERNANCE_AND_ENGINEERING.md §1, "Code policy" (GOV-1-07)
#
# Every dependency declared anywhere in the workspace — `[dependencies]`,
# `[dev-dependencies]`, `[build-dependencies]`, and any `[target.*]` variant, in
# `Cargo.toml` or in any `crates/*/Cargo.toml` — has exactly one entry here.
# `tools/governance/check_code_policy.py` fails if a dependency has no entry, if
# an entry names a dependency nobody declares, or if an entry's `origin`,
# `used_by`, or `kinds` disagrees with the manifests. Adding a dependency is
# therefore a two-step change: edit the manifest, then say here why it exists and
# what trusting it costs.
#
# `tcb_class` — what a bug in this dependency can do:
#
#   trusted-checking-base
#       Linked by `continuum-kernel-*` or `continuum-certificate`, or otherwise
#       inside the certificate-checking trust base (docs/03 §5): a bug here can
#       make an unsound claim believable. The check *enforces* this class for
#       anything the certificate checker links — it is not a self-assessment.
#   engine
#       Linked by search, elaboration, or tooling that produces results the trust
#       base then re-checks from wire form. A bug here produces a wrong answer
#       that the kernel is expected to reject.
#   dev-only
#       Only ever a `[dev-dependencies]` entry. Never in a shipped artifact.
#   build-only
#       Only ever a `[build-dependencies]` entry. In the build graph, not the
#       runtime graph.
#
# The workspace declares exactly one external dependency: `blake3`, entered in
# `bn-30eym` to fill the ADR-0013 hash seam. Every other entry below is a
# workspace-internal path edge. The bar for a second one is the same as the bar
# for the first: an honest class, a stated cost, and a tree small enough to read.
#
# --- blake3, the one external edge ------------------------------------------
#
# Version and features are pinned once, in the root `[workspace.dependencies]`:
#
#     blake3 = { version = "1.8.5", default-features = false, features = ["pure"] }
#
# `cargo tree -p continuum-value -e normal,build --target all` at that pin:
#
#     continuum-value
#     └── blake3 v1.8.5
#         ├── arrayref v0.3.9
#         ├── arrayvec v0.7.8          (default-features = false)
#         ├── cfg-if v1.0.4
#         ├── constant_time_eq v0.4.2  (default-features = false)
#         └── cpufeatures v0.3.0
#             └── libc v0.2.189        (aarch64/loongarch targets only)
#         [build-dependencies]
#         └── cc v1.4.0
#             ├── find-msvc-tools v0.1.9
#             └── shlex v2.0.1
#
# Nine crates, of which five are compiled into the artifact on x86-64 and four
# are build-graph only. Two feature choices shrink it and are load-bearing:
# `default-features = false` drops `std` (the seam is a pure `&[u8] -> [u8; 32]`
# function; nothing here writes through `io::Write` or maps a file), and `pure`
# stops `blake3`'s `build.rs` from invoking a C compiler on the bundled assembly
# and intrinsics, selecting its Rust SIMD implementations instead. `cc` stays in
# the build graph because `blake3` declares it unconditionally, but with `pure`
# it is never *called*: no C toolchain is required to build this workspace, and
# the emitted digests are not a function of the host's `cc`. That matters because
# plan §20 requires trust-base crates to "build reproducibly from pinned sources"
# and INV-014 requires a receipt's build identity to be independently
# re-derivable. BLAKE3's output is specified, so `pure` costs throughput and
# nothing else — `blake3_matches_the_published_test_vectors` pins the
# specification's own vectors as literals, so a feature or version change that
# altered the function fails the gate instead of silently redefining every
# artifact token.

[[dependency]]
name = "blake3"
origin = "external"
tcb_class = "trusted-checking-base"
kinds = ["normal"]
used_by = ["continuum-value"]
rationale = "The cryptographic hash behind continuum-value's ContentHasher seam (identity::Blake3Hasher): ADR-0013's \"artifact digests use cryptographic hashes\" and docs/09 T02's control 3, \"cryptographic digests for artifact identity\". Vendored rather than hand-rolled because a hand-rolled primitive would look like a release hash and not be one (identity.rs, \"The hash seam\"); BLAKE3 specifically because it is specified, has published test vectors this crate pins as literals, is pure Rust under the `pure` feature so no C toolchain enters a trust-base crate's build, and needs no seed, clock, or interior state — the seam requires a function of its input alone (docs/19 §7). Classed trusted-checking-base because it is linked in normal position by continuum-value, which is itself trusted-checking-base and inside docs/33's smallest trust base; a dependency of the trust base is in the trust base whatever the consuming call site does with it, and the class must not be a self-assessment that a caller's discipline pays for. What that discipline actually buys is stated for the reviewer rather than used to discount the class: under ADR-0013 a certified identity IS the canonical Value::encode byte string and every digest collision is resolved by exact comparison, so no defect in this crate — collision, truncation, or a wrong digest outright — can make two distinct values one certified identity or hide one from an IdentityIndex; identity.rs's collision-injection suite asserts exactly that while hashers that collide by construction are installed, and mentions BLAKE3 nowhere. The blast radius a defect does have is real and is why the class is not lower: artifact-handle tokens and store paths are digests (plan §4.4), a HashIdentity in a labeled non-certified lane IS its digest by construction (ADR-0013's rejected alternative 2), and T02 control 3 is a defense-in-depth control that a broken hash silently removes."

[[dependency]]
name = "continuum-value"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuum-intent", "continuum-task", "continuumd"]
rationale = "Canonical value encoding, content identity, epochs, and the assurance envelope (ADR-0013); a machine result cannot name its epochs or its envelope without them. continuum-intent reuses the ContentHasher/Digest256 identity seam for RFC 0037's canonical property bytes rather than opening a second one. continuumd's native protocol takes ProtocolEpoch and EpochIdentity as-is because RFC 0026 requires the daemon and that module to agree on negotiation and the N/N-1 window, and two spellings of one identity is what ADR-0013 forbids."

[[dependency]]
name = "continuum-workspace"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuumd"]
rationale = "The snapshot model and the publication/authorization reference implementation the daemon's workspace operation family wires: import, overlay, fork, seal, diff, and the typed StaleSnapshot the wire code of the same name reports (plan §4.2, RFC 0026 rule errors.common). RFC 0027's Landed vocabulary clause binds this RFC and that module together and makes its store-side CapabilityDescriptor a declared subset of the wire one, so the daemon holds the wire descriptor and derives the store's from it rather than keeping a second capability table. Classed trusted-checking-base rather than engine because ReferenceStore::authorize is where an admission decision is actually taken and audited: a defect there makes an unauthorized read believable, and nothing downstream re-checks an authorization the way the kernel re-checks a certificate."

[[dependency]]
name = "continuum-intent"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuumd"]
rationale = "The Intent Contract, its ID5 canonical JSON writer, and RFC 0037's field-level change policy — the fifteen policy keys, the eight verbs, the W6 applicability matrix, and the P1-P6 enforcement — which the daemon's intent family enforces rather than restates. INV-001 says ordinary operations cannot mutate intent; that is this crate's immutability (no &mut self anywhere in it) plus the daemon's admission predicate, and a second policy table in continuumd would be exactly the second spelling ADR-0013 forbids. Classed trusted-checking-base because the contract parser and the lock policy sit inside docs/33's smallest trust base by that crate's own boundary contract, and a defect in the verb matrix makes a forbidden intent weakening look permitted."

[[dependency]]
name = "continuum-evidence"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuum-task", "continuumd"]
rationale = "The claim-status lattice that decides whether a write would lower a claim (plan §11.4, §11.7); a second implementation would be a checker checking its own assumption. continuumd's evidence.verify promotion is that compare-and-set: the crate's own module documentation names the daemon and any independent linearizability checker (plan §24.5) as the two consumers that must share one implementation of the order, and a lost CAS is what the wire's StatusConflict reports. Classed trusted-checking-base because the non-regression predicate is what stands between a racing promotion and a silently lowered claim; nothing downstream re-derives it."

[[dependency]]
name = "continuum-task"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuumd"]
rationale = "The region calculus plan §20 gives that crate — task lifecycle, committed partial evidence, suspension/continuation, drain and finalize behavior, and the guarantee of no orphan workers — which PR 6 puts continuumd's task work inside rather than restating: every unit of that work is a region opened and finalized within one dispatch, task.cancel drives RFC 0026's request → drain → finalize through it, and the three arms of rule task.cancel_correct are its CancelOutcome, which has no constructor for committed evidence without a continuation or for a continuation without committed evidence. Classed trusted-checking-base because nothing downstream re-derives what it decides: a defect in the obligation ledger makes a leaked obligation look discharged and a defect in the outcome table makes a truncated campaign look resumable, and both are wire claims a client has no second reading of — the same argument continuum-evidence's entry makes about the claim-status lattice. It adds no runtime and no external edge: the crate has no thread, clock, executor or interior mutability, and its own two dependencies are continuum-value and continuum-evidence, both already here. The asupersync adapter is a Phase B deliverable in continuum-asupersync (plan §21) and this edge is not it."

[[dependency]]
name = "continuum-cml-syntax"
origin = "workspace"
tcb_class = "engine"
kinds = ["normal"]
used_by = ["continuum-cml-elab"]
rationale = "The model-language surface syntax the elaborator consumes; elaboration is a producer whose output is re-checked, so a parse bug surfaces as a wrong model rather than as false assurance."

[[dependency]]
name = "continuum-engine-reference"
origin = "workspace"
tcb_class = "engine"
kinds = ["dev", "normal"]
used_by = ["continuumd"]
rationale = "The exact finite model service PR 8 wraps behind the native protocol, and the one engine continuumd's verification family runs: verification.start explores breadth-first under declared bounds, checks the declared invariants and the deadlock question, and projects the engine's own answers onto the wire — the reachable-state count into Cost.states, the report's three-way verdict into SemanticVerdictValue, the engine's typed Unresolved into the INV-008 inconclusive reason, and the queue-ordered frontier of a bounded run into the cont_* continuation. Nothing is re-decided here and no second exploration exists to disagree with it. Classed engine, which is exactly what the class means: an engine is an untrusted producer whose results reach the trust base only as certificates re-checked from wire form, so a defect here produces a wrong verification answer that a finite-closure certificate check is expected to reject — it cannot make a certificate believable, because this daemon emits none and the kernel shares no code with it. The edge is permitted: the forbidden engine edge is the certificate checker's (START_HERE's 'the certificate checker may not depend on search', enforced as RULE certificate-checker-not-search over continuum-kernel-* and continuum-certificate), and continuumd is on the other side of it while plan §4.1 lists an Engine orchestrator among the things continuumd is composed of."

[[dependency]]
name = "continuum-kernel-core"
origin = "workspace"
tcb_class = "dev-only"
kinds = ["dev"]
used_by = ["continuum-engine-reference"]
rationale = "The differential itself, and dev-position only. crates/continuum-engine-reference/tests/certificate_kernel_differential.rs feeds the finite-closure certificate the reference engine emits to check_certificate and asserts the verdict — the fourth frozen TV-009 fact, 'certificate accepted by an independent checker'. The library edge does not exist and must not: plan §20 puts a serialization boundary between every engine and the kernel, and src/certificate.rs writes the wire form from the documented grammar so producer and checker share no codec (docs/03 §8, 'certificate decoding' is an axis independent paths must differ along). The class is dev-only because that is what the edge is — the checker is never in a shipped artifact of this crate — and because tools/check_crate_boundaries.py:37-39 admits exactly this case: 'dev-dependencies are reported but not enforced, because a differential test may legitimately link an engine it would never ship against'. A bug in the kernel here can only make this test wrong, never a claim believable: the kernel's own trust class is established where the kernel is checked (tools/check_kernel_covenant.py), not by this edge."
