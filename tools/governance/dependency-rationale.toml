# Dependency rationale and TCB classification.
#
#   dependency additions require rationale and TCB classification.
#     — notes/plan/docs/12_GOVERNANCE_AND_ENGINEERING.md §1, "Code policy" (GOV-1-07)
#
# Every dependency declared anywhere in the workspace — `[dependencies]`,
# `[dev-dependencies]`, `[build-dependencies]`, and any `[target.*]` variant, in
# `Cargo.toml` or in any `crates/*/Cargo.toml` — has exactly one entry here.
# `tools/governance/check_code_policy.py` fails if a dependency has no entry, if
# an entry names a dependency nobody declares, or if an entry's `origin`,
# `used_by`, or `kinds` disagrees with the manifests. Adding a dependency is
# therefore a two-step change: edit the manifest, then say here why it exists and
# what trusting it costs.
#
# `tcb_class` — what a bug in this dependency can do:
#
#   trusted-checking-base
#       Linked by `continuum-kernel-*` or `continuum-certificate`, or otherwise
#       inside the certificate-checking trust base (docs/03 §5): a bug here can
#       make an unsound claim believable. The check *enforces* this class for
#       anything the certificate checker links — it is not a self-assessment.
#   engine
#       Linked by search, elaboration, or tooling that produces results the trust
#       base then re-checks from wire form. A bug here produces a wrong answer
#       that the kernel is expected to reject.
#   dev-only
#       Only ever a `[dev-dependencies]` entry. Never in a shipped artifact.
#   build-only
#       Only ever a `[build-dependencies]` entry. In the build graph, not the
#       runtime graph.
#
# The workspace declares four external dependencies: `blake3`, entered in
# `bn-30eym` to fill the ADR-0013 hash seam, `asupersync`, entered in
# `bn-lf4i` as the Phase B substrate (ADR-0001, ADR-0053 D0), and
# `ed25519-dalek` and `zeroize`, entered in `bn-2ee4c` for plan §18.6 signing
# identities (ADR-0054). Every other entry
# below is a workspace-internal path edge. The bar for each one is the same: an
# honest class, a stated cost, and a tree someone has read.
#
# --- blake3, the first external edge -----------------------------------------
#
# Version and features are pinned once, in the root `[workspace.dependencies]`:
#
#     blake3 = { version = "1.8.5", default-features = false, features = ["pure"] }
#
# `cargo tree -p continuum-value -e normal,build --target all` at that pin:
#
#     continuum-value
#     └── blake3 v1.8.5
#         ├── arrayref v0.3.9
#         ├── arrayvec v0.7.8          (default-features = false)
#         ├── cfg-if v1.0.4
#         ├── constant_time_eq v0.4.2  (default-features = false)
#         └── cpufeatures v0.3.0
#             └── libc v0.2.189        (aarch64/loongarch targets only)
#         [build-dependencies]
#         └── cc v1.4.0
#             ├── find-msvc-tools v0.1.9
#             └── shlex v2.0.1
#
# Nine crates, of which five are compiled into the artifact on x86-64 and four
# are build-graph only. Two feature choices shrink it and are load-bearing:
# `default-features = false` drops `std` (the seam is a pure `&[u8] -> [u8; 32]`
# function; nothing here writes through `io::Write` or maps a file), and `pure`
# stops `blake3`'s `build.rs` from invoking a C compiler on the bundled assembly
# and intrinsics, selecting its Rust SIMD implementations instead. `cc` stays in
# the build graph because `blake3` declares it unconditionally, but with `pure`
# it is never *called*: no C toolchain is required to build this workspace, and
# the emitted digests are not a function of the host's `cc`. That matters because
# plan §20 requires trust-base crates to "build reproducibly from pinned sources"
# and INV-014 requires a receipt's build identity to be independently
# re-derivable. BLAKE3's output is specified, so `pure` costs throughput and
# nothing else — `blake3_matches_the_published_test_vectors` pins the
# specification's own vectors as literals, so a feature or version change that
# altered the function fails the gate instead of silently redefining every
# artifact token.

[[dependency]]
name = "blake3"
origin = "external"
tcb_class = "trusted-checking-base"
kinds = ["normal"]
used_by = ["continuum-value"]
rationale = "The cryptographic hash behind continuum-value's ContentHasher seam (identity::Blake3Hasher): ADR-0013's \"artifact digests use cryptographic hashes\" and docs/09 T02's control 3, \"cryptographic digests for artifact identity\". Vendored rather than hand-rolled because a hand-rolled primitive would look like a release hash and not be one (identity.rs, \"The hash seam\"); BLAKE3 specifically because it is specified, has published test vectors this crate pins as literals, is pure Rust under the `pure` feature so no C toolchain enters a trust-base crate's build, and needs no seed, clock, or interior state — the seam requires a function of its input alone (docs/19 §7). Classed trusted-checking-base because it is linked in normal position by continuum-value, which is itself trusted-checking-base and inside docs/33's smallest trust base; a dependency of the trust base is in the trust base whatever the consuming call site does with it, and the class must not be a self-assessment that a caller's discipline pays for. What that discipline actually buys is stated for the reviewer rather than used to discount the class: under ADR-0013 a certified identity IS the canonical Value::encode byte string and every digest collision is resolved by exact comparison, so no defect in this crate — collision, truncation, or a wrong digest outright — can make two distinct values one certified identity or hide one from an IdentityIndex; identity.rs's collision-injection suite asserts exactly that while hashers that collide by construction are installed, and mentions BLAKE3 nowhere. The blast radius a defect does have is real and is why the class is not lower: artifact-handle tokens and store paths are digests (plan §4.4), a HashIdentity in a labeled non-certified lane IS its digest by construction (ADR-0013's rejected alternative 2), and T02 control 3 is a defense-in-depth control that a broken hash silently removes."

# --- asupersync, the substrate edge -------------------------------------------
#
# Pinned once, in the root `[workspace.dependencies]`:
#
#     asupersync = { version = "=0.5.0", default-features = false,
#                    features = ["deterministic-mode"] }
#
# `=0.5.0` is exact, not a caret range: 0.5.0 is the latest published version
# (`cargo search`, 2026-09-22), the license rider travels with every binary that
# links it (ADR-0053 D0), and the audit gate binds each package to one checksum.
#
# Features, each for a stated reason:
#
#   default-features = false
#       Drops `proc-macros` and `nightly-outcome-try`. `proc-macros` pulls
#       `asupersync-macros` (a proc-macro executes inside the compiler) plus its
#       syn/quote tree; the adapter writes no attribute macros. The other is a
#       nightly-only `Try` impl, and the pinned toolchain is stable.
#   deterministic-mode
#       A dependency-free cfg flag. Without it the four lab oracles
#       (cancellation_protocol, channel_atomicity, region_leak, waker_dedup) stamp
#       violations with `SystemTime::now()`. With it they stamp a fixed epoch, so
#       an oracle's output is a function of the schedule alone (INV-005, ADR-0003).
#
# The lab (deterministic) runtime is not feature-gated upstream, so no other
# feature is needed. The cost that remains is large and is stated, not
# discounted: the crate declares 31 non-optional dependencies plus seven more on
# every non-wasm target (crypto: sha1/sha2/hmac/aes-gcm/chacha20poly1305/nkeys;
# codecs: serde_json/rmp-serde/bincode-next/prost; OS: libc/nix/socket2/polling/
# signal-hook/sysinfo/tempfile), so the resolved tree grows from ten external
# packages to 184. Its build.rs runs `git` from its manifest directory for a
# revision stamp, unless ASUPERSYNC_GIT_COMMIT is set; in the registry copy
# that directory is not a git work tree. Every one of those packages needs a
# `dependency-audits.toml` entry before the gate passes; bn-lf4i recorded them.
# `.cargo/config.toml` sets ASUPERSYNC_GIT_COMMIT so that build.rs runs no `git`,
# and ASUPERSYNC_AUTO_ARTIFACTS=0 so the lab harness writes no crashpacks.

[[dependency]]
name = "asupersync"
origin = "external"
tcb_class = "engine"
kinds = ["normal"]
used_by = ["continuum-asupersync"]
rationale = "The Phase B substrate itself (ADR-0001, plan §21): continuum-asupersync (PR-14-IMPL-01, src/binding.rs) drives asupersync's lab runtime under a Continuum ChoiceLog and observes the lifecycle journal from the substrate's own trace, so the region calculus in continuum-task is checked against runs of real asupersync code rather than against a scripted source alone. The licensee accepts the rider for linking (ADR-0053 D0) and has ruled on agent development-process exposure to it (ADR-0053 D7). Classed engine, not trusted-checking-base: continuum-asupersync is linked by no certificate checker and by no continuum-kernel-* crate (plan §20, INV-004, enforced by tools/check_crate_boundaries.py), and a journal it produces is lifted into continuum_task::region and checked there, so a substrate defect yields a wrong or rejected journal, never a certified claim. What the class does not discount: the substrate is the Program half of Model/Program/Proof, so a defect that reorders events consistently can make a conformance result wrong in a way only a differential run against the reference schedule detects; the journal's lift-vs-Schedule differential test exists for that reason. Declared with default-features = false and only `deterministic-mode`, whose sole effect is to remove SystemTime::now() from the lab oracles' violation stamps (INV-005); the root Cargo.toml and the section comment above give each choice."

# --- ed25519-dalek, the signature edge ----------------------------------------
#
# Pinned once, in the root `[workspace.dependencies]`:
#
#     ed25519-dalek = { version = "=2.2.0", default-features = false,
#                       features = ["zeroize"] }
#
# 2.2.0 is exactly the version asupersync's `nkeys` edge already resolved, so
# this entry adds no package to Cargo.lock: `ed25519-dalek`, `ed25519`,
# `curve25519-dalek`, `curve25519-dalek-derive`, `sha2 0.10.9`, `signature`,
# `subtle`, `zeroize`, and `fiat-crypto` each already carry a bn-lf4i audit
# entry for the exact checksum. The lock diff is two feature-unification edges
# (`zeroize` under both dalek crates) and the new continuum-evidence edge.
# ADR-0054 records the scheme choice and the alternatives.

[[dependency]]
name = "ed25519-dalek"
origin = "external"
tcb_class = "trusted-checking-base"
kinds = ["normal"]
used_by = ["continuum-evidence"]
rationale = "The signature primitive behind plan §18.6 and docs/09 §10 signing identities (ADR-0054): continuum-evidence's signing module signs and verifies receipts, intent bundles and domain packs over their ADR-0013 canonical bytes, and verification is Ed25519 strict (`verify_strict`, RFC 8032 cofactorless with small-order and non-canonical rejection). Chosen over a hand-rolled primitive because a hand-rolled signature would look like one and not be one, and over ring/aws-lc (C and assembly in the trust base's build graph) and p256/ecdsa (a nonce per signature, so a signature is not a function of key and message — INV-005). The crate is `#![forbid(unsafe_code)]` outside tests; its curve25519-dalek backend is the one place unsafe SIMD code exists, and bn-lf4i's audit records it. Declared with default-features = false: no `std`, no `fast` precomputed tables, and no `rand_core`, so `SigningKey::generate` does not exist in this build and a key is only ever `SigningKey::from_bytes` over a seed that reached the crate through the explicit KeyEntropy capability (INV-005, ADR-0003); `zeroize` is on so a dropped secret is wiped. Classed trusted-checking-base, not engine: it is linked by continuum-evidence, itself trusted-checking-base, and a defect here makes a forged signature believable, which nothing downstream re-checks. It is NOT linked by continuum-certificate or any continuum-kernel-* crate (plan §20, INV-004): a signature binds authorship, never proof validity (RFC 0032 \"Signing\", ADR-0035). The same exact version was already in the resolved tree through asupersync's nkeys, so this edge adds no audited package."

[[dependency]]
name = "zeroize"
origin = "external"
tcb_class = "trusted-checking-base"
kinds = ["normal"]
used_by = ["continuum-evidence"]
rationale = "Wipes continuum-evidence's 32-byte key seed after key derivation (ADR-0054, review cr-3e3t1j): KeyEntropy::seed returns Zeroizing<[u8; 32]>, and LocalSigner::from_seed takes it by value, so the seed is wiped on every success and error path of mint rather than dropped as a plain stack array; ed25519-dalek's own SigningKey already zeroizes its copy through the same crate. Pinned exactly at =1.9.0, the version ed25519-dalek already resolved and bn-lf4i audited, with default-features = false (no alloc), so the edge adds no package. Classed trusted-checking-base because continuum-evidence is; a defect here leaves a secret in memory, it cannot make a signature verify."

[[dependency]]
name = "continuum-value"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuum-asupersync", "continuum-benchmark", "continuum-cli", "continuum-context", "continuum-debugger", "continuum-evidence", "continuum-incremental", "continuum-intent", "continuum-mcp", "continuum-repair", "continuum-security", "continuum-task", "continuumd"]
rationale = "Canonical value encoding, content identity, epochs, and the assurance envelope (ADR-0013); a machine result cannot name its epochs or its envelope without them. continuum-asupersync (PR-14-IMPL-01) digests the semantic journal through the same Blake3Hasher seam and returns the typed INV-008 reasons for an uninstrumented primitive, for a family the substrate binding does not drive, and for a substrate run it cannot observe completely. continuum-intent reuses the ContentHasher/Digest256 identity seam for RFC 0037's canonical property bytes rather than opening a second one. continuumd's native protocol takes ProtocolEpoch and EpochIdentity as-is because RFC 0026 requires the daemon and that module to agree on negotiation and the N/N-1 window, and two spellings of one identity is what ADR-0013 forbids. continuum-benchmark and continuum-mcp take the same ProtocolWindow to negotiate a real handshake rather than assert one: PR 10's benchmark rig and the typed client's own evidence each open a connection against a daemon, and a second window constant on the client side would be a second spelling of the rule RFC 0026 fixes. continuum-evidence takes three vocabularies rather than restating them: ADR-0013 content identity, because an evidence node or edge that had to be *named* would otherwise get a second answer to \"are these the same artifact\"; ValidationBasis and the typed INV-008 InconclusiveReason, which plan §11.4 attaches to the validated and inconclusive statuses and which claim_status.rs has recorded as this crate's missing half since PR-1 / IMPL-06; and EpochSet, because plan §4.6 makes evidence epoch-scoped and a provenance record that cannot name the epochs a write happened under cannot support that sentence. continuum-context (PR-11 / IMPL-03) takes the `Name` canonical-identifier grammar for a `selected[]` item's `id` and a model action's name, so a Context Pack reference is typed rather than a bare string with no shared vocabulary behind it. continuum-security (bn-1hape) takes the canonical Value decoder to read back the signing keystore's persisted audit log, the same encoding SigningRegistry::audit_value writes. continuum-incremental (bn-31vf, PR-22A / IMPL-02) takes the BLAKE3 hasher for the content commitments of its query keys and outputs; a commitment only indexes, and every cache hit is admitted after an exact canonical-byte comparison (ADR-0013). continuum-repair (bn-2d70, PR-20 / IMPL-01) names a transaction version's `rt_` handle by a digest of its canonical preimage through the ContentHasher seam; the identity is the preimage bytes, and the digest only indexes (ADR-0013). continuum-debugger (bn-3km4z, PR 18) takes the typed INV-008 InconclusiveReason for a causal reduction that runs out of budget or whose replay oracle breaks its contract, rather than a second spelling of those reasons."

[[dependency]]
name = "continuum-workspace"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuum-benchmark", "continuum-cli", "continuum-context", "continuum-mcp", "continuum-security", "continuumd"]
rationale = "The snapshot model and the publication/authorization reference implementation the daemon's workspace operation family wires: import, overlay, fork, seal, diff, and the typed StaleSnapshot the wire code of the same name reports (plan §4.2, RFC 0026 rule errors.common). RFC 0027's Landed vocabulary clause binds this RFC and that module together and makes its store-side CapabilityDescriptor a declared subset of the wire one, so the daemon holds the wire descriptor and derives the store's from it rather than keeping a second capability table. Classed trusted-checking-base rather than engine because ReferenceStore::authorize is where an admission decision is actually taken and audited: a defect there makes an unauthorized read believable, and nothing downstream re-checks an authorization the way the kernel re-checks a certificate. PR 10's benchmark rig and the typed client's evidence fixture stage the corpus through the same WorkspacePath and ContentIdentifier seam a deployment would, because staging is administration (IDL §7) and staging it any other way would name the content differently from the daemon that then resolves it. continuum-context (PR-11 / IMPL-03) takes `WorkspacePath` for a source-span reference's `file` field, so a Context Pack's source reference is validated exactly as the workspace itself validates a path (no `.`/`..`, no traversal) rather than a second, unvalidated string; it also takes `ArtifactClass`/`ArtifactHandle` for a model action's optional `model_*` reference, the same class-checked handle type every other artifact-referencing crate here uses. continuum-security (bn-ymw) takes `ArtifactClass` alone, for the prompt-injection corpus's \"across every agent-readable artifact class\" criterion: that criterion is only checkable against plan §4.4's closed nineteen, so injection::readability classifies each variant of this crate's enum and the corpus suite fails when a class it calls readable has no case — a second list there would be the second spelling ADR-0013 forbids and would silently miss a class the plan adds."

[[dependency]]
name = "continuum-intent"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuum-benchmark", "continuum-cli", "continuum-cml-elab", "continuum-context", "continuum-forge", "continuum-mcp", "continuum-repair", "continuum-semantic-diff", "continuumd"]
rationale = "The Intent Contract, its ID5 canonical JSON writer, and RFC 0037's field-level change policy — the fifteen policy keys, the eight verbs, the W6 applicability matrix, and the P1-P6 enforcement — which the daemon's intent family enforces rather than restates. INV-001 says ordinary operations cannot mutate intent; that is this crate's immutability (no &mut self anywhere in it) plus the daemon's admission predicate, and a second policy table in continuumd would be exactly the second spelling ADR-0013 forbids. Classed trusted-checking-base because the contract parser and the lock policy sit inside docs/33's smallest trust base by that crate's own boundary contract, and a defect in the verb matrix makes a forbidden intent weakening look permitted. PR 10's benchmark rig and the typed client's evidence fixture decode the governing Intent Contract and accept it before any snapshot exists, because workspace.create requires one; they read the contract and mint no policy of their own. continuum-semantic-diff (PR 12) classifies `observers[]` directly against this crate's Observer/ObserverSet field-group types and reports through its closed Relation/PolicyField vocabulary rather than opening a second one, per RFC 0031's observers rule. continuum-context (PR-11 / IMPL-03) takes the ID5 canonical-JSON writer (`canonical_json::Json`) to render a `selected[]` item, because `context-pack.schema.json` is a JSON-schema-normative artifact exactly as `intent-contract.schema.json` is (RFC 0037 ID5), and reusing this crate's writer — already a cross-crate dependency of continuum-benchmark's — is the one canonical encoding rather than a second, hand-rolled one. continuum-forge (bn-1dsih) takes the Intent Contract itself and `Optimization::require_non_vacuity`, because RFC 0037 AO2 names the lane that assembles a synthesis task as the caller with standing for INV-012's non-vacuity obligation, and a Forge-side re-implementation of that obligation would be a second answer to \"may this contract govern a task\" — the same second-spelling this table forbids everywhere else. The edge runs Forge to intent and never the reverse, which is plan §20's \"Forge depends on verifier interfaces, never vice versa\" and is enforced by tools/check_crate_boundaries.py's forge-not-imported-by-verifier rule. continuum-cml-elab (bn-3a9sr) takes canonical_json alone: the RFC 0003 run configuration is a JSON artifact (run-config.schema.json), read with this strict reader (duplicate keys, floats, trailing bytes, and depth refused) and identified by its ID5 canonical bytes, so the front end does not grow a second JSON reader or writer (ADR-0013). continuum-repair (bn-2d70, PR-20 / IMPL-01) takes `IntentId` for a transaction's `base_intent` and the ID5 writer for the repair-transaction artifact, because repair-transaction.schema.json is a JSON artifact and a second writer would be a second spelling (ADR-0013)."

[[dependency]]
name = "continuum-evidence"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuum-security", "continuum-task", "continuumd"]
rationale = "The claim-status lattice that decides whether a write would lower a claim (plan §11.4, §11.7); a second implementation would be a checker checking its own assumption. continuumd's evidence.verify promotion is that compare-and-set: the crate's own module documentation names the daemon and any independent linearizability checker (plan §24.5) as the two consumers that must share one implementation of the order, and a lost CAS is what the wire's StatusConflict reports. Classed trusted-checking-base because the non-regression predicate is what stands between a racing promotion and a silently lowered claim; nothing downstream re-derives it. continuum-security (bn-1hape) takes the signing library (ADR-0054) to supply it: entropy::OsEntropy is the production KeyEntropy capability and keystore::LocalKeystore persists the solo-developer key minted on first use through SigningRegistry::mint. The edge runs boundary to semantic core only; no semantic-core crate depends on continuum-security, which tests/entropy_isolation.rs checks from the real manifests."

[[dependency]]
name = "continuum-task"
origin = "workspace"
tcb_class = "trusted-checking-base"
kinds = ["dev", "normal"]
used_by = ["continuum-asupersync", "continuumd"]
rationale = "The region calculus plan §20 gives that crate — task lifecycle, committed partial evidence, suspension/continuation, drain and finalize behavior, and the guarantee of no orphan workers — which PR 6 puts continuumd's task work inside rather than restating: every unit of that work is a region opened and finalized within one dispatch, task.cancel drives RFC 0026's request → drain → finalize through it, and the three arms of rule task.cancel_correct are its CancelOutcome, which has no constructor for committed evidence without a continuation or for a continuation without committed evidence. Classed trusted-checking-base because nothing downstream re-derives what it decides: a defect in the obligation ledger makes a leaked obligation look discharged and a defect in the outcome table makes a truncated campaign look resumable, and both are wire claims a client has no second reading of — the same argument continuum-evidence's entry makes about the claim-status lattice. It adds no runtime and no external edge: the crate has no thread, clock, executor or interior mutability, and its own two dependencies are continuum-value and continuum-evidence, both already here. The asupersync adapter is a Phase B deliverable in continuum-asupersync (plan §21) and this edge is not it. continuum-asupersync (PR-14-IMPL-01) takes the edge the other way round from a runtime: its semantic journal is lifted into RegionTree and checked there, so the region calculus is the specification the adapter conforms to, and the calculus knows nothing of the adapter."

[[dependency]]
name = "continuum-context"
origin = "workspace"
tcb_class = "engine"
kinds = ["dev", "normal"]
used_by = ["continuum-cli", "continuumd"]
rationale = "The Context Pack itself (plan §6, RFC 0028), which continuumd's `context` family projects onto the wire rather than restates: the closed five-member OmissionReason and eleven-member ExpansionRelation vocabularies, the INV-007 omission record whose two schema conditionals are unrepresentable rather than validated, the closed accounting under which a candidate with no disposition cannot be published at all, the content-derived ExpansionHandle that makes `context.expand` idempotent by construction rather than by the ledger, and the child-document derivation an expansion answers with. A second copy of any of those in continuumd would be the second spelling ADR-0013 forbids, and it would be free to disagree with the artifact about what the pack says. Classed engine rather than trusted-checking-base: a pack is an explanation, `publishing a pack MUST NOT change any claim status` (INV-015, plan §11.7), the crate is linked by no certificate checker, and RFC 0028 requires every pack guarantee to be re-checked by a checker independent of the compiler that claimed it (C6, `Validation`) — so a defect here yields a wrong or incomplete explanation the way an engine defect yields a wrong answer, never a promoted claim. What that class does not discount, and is recorded here for the reviewer: the omission manifest is a transparency claim a consumer has no second reading of, which is why the manifest is derived from one ledger and reconciled independently inside that crate rather than assembled beside the selection. PR 13's human CLI takes it dev-only, for the reason its other four fixture edges exist: `tests/context_expand.rs` registers a real Context Pack with a real daemon and drives `context expand` over a `LocalPair` boundary, and a fixture that spelled its own pack vocabulary would be testing the renderer against a shape no daemon produces."

[[dependency]]
name = "continuum-cml-syntax"
origin = "workspace"
tcb_class = "engine"
kinds = ["normal"]
used_by = ["continuum-cml-elab", "continuum-incremental"]
rationale = "The model-language surface syntax the elaborator consumes; elaboration is a producer whose output is re-checked, so a parse bug surfaces as a wrong model rather than as false assurance. continuum-incremental (bn-31vf, PR-22A / IMPL-02) memoizes `parse` over it and keys `elaborate` by its span-free tree dump, so a whitespace or comment edit re-parses and then cuts off early; it adds no parser of its own."

[[dependency]]
name = "continuum-cml-elab"
origin = "workspace"
tcb_class = "engine"
kinds = ["normal"]
used_by = ["continuum-incremental"]
rationale = "The CML elaborator and lowering, which continuum-incremental (bn-31vf, PR-22A / IMPL-02) memoizes as its `elaborate` and `build_model` queries and keys by the normalized identity, so a rename of a let, def or bound variable reuses everything downstream. Classed engine: elaboration produces a model whose results reach the trust base only as certificates re-checked from wire form, so a defect here yields a wrong model, not believable assurance. The spike runs it under the crate's own pre-charged Limits and never memoizes a budget-dependent failure; it adds no front end of its own and imports no adapter or Forge."

[[dependency]]
