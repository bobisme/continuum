[[audits.asupersync]]
version = "0.5.0"
checksum = "f34b1a19ffd6b74570339a156912436335bb09c594c675c62ea164b19a1f2511"
who = "continuum-dev"
criteria = ["safe-to-deploy"]
notes = """
Risk-directed partial audit, not a line-by-line review: the crate is about
1.56M lines (57 MB of src/), so we read the risk surfaces only. Registry
source; .cargo_vcs_info.json names upstream commit 78b64636e99f.

build.rs (read in full, 55 lines): emits `rerun-if-env-changed=
ASUPERSYNC_GIT_COMMIT` and at most one `rustc-env=ASUPERSYNC_BUILD_GIT_
COMMIT=<hex>`. If ASUPERSYNC_GIT_COMMIT is set, it uses that value (40 or 64
hex chars, else nothing). If not, it runs local `git rev-parse --show-prefix`,
`git status --porcelain=v1 --untracked-files=normal` and `git rev-parse HEAD`
in CARGO_MANIFEST_DIR. It stops unless the prefix is empty (the manifest dir
is a repo root) and the tree is clean. A registry checkout is not a repo root,
so no stamp is emitted. The script does no fetch, no network and no file write
of its own, and it does not use OUT_DIR. Edge case: `git status` can refresh
an index, and an ambient GIT_DIR in the build environment would point git at
that repository. The stamp is read only by lab crashpack metadata
(lab/runtime.rs `compiled_commit_hash`).

Unsafe: lib.rs has `#![deny(unsafe_code)]`, and each unsafe site carries a
local `allow` (36 files carry one). A grep finds 541
non-comment lines with the `unsafe` token, and about 40 of them are string
literals. We read 53 blocks and classified 15 more as test-only by location.
- Scheduler, wakers, channels: runtime/scheduler/*, channel/*,
  runtime/waker.rs and cx/* contain no unsafe. Wakers use std `Wake`. There is
  no global allocator and no `transmute` anywhere in src/.
- Read in full: the sync/mutex.rs and sync/rwlock.rs Send/Sync impls,
  UnsafeCell guard derefs and ptr::read-then-ManuallyDrop guard projections
  (19). stream/broadcast_stream.rs into_inner (2). The time/intrusive_wheel.rs
  list primitives (5). This module is a public unsafe-fn API that nothing
  else in the crate uses.
- FFI sample: runtime/reactor/epoll.rs fstat/BorrowedFd (4), net/unix/stream.rs
  recvmsg/SCM_RIGHTS parsing (1), resource_monitor getrusage/MaybeUninit (3),
  process.rs fcntl/setpgid/setsid in pre_exec/kill (6), atp timing_security
  cpuid/rdtsc (2), atp journal fallocate/statfs (2), Windows-only udp/mirror/
  metadata (3), security/secret.rs volatile zeroize (1), io-uring fs (2), BSD
  test sockopts (2). Each is a thin syscall wrapper with checked lengths and
  error returns.
- raptorq/gf256.rs holds 177 of the sites. The whole module enables
  `allow(unsafe_code)` only under the non-default `simd-intrinsics` feature,
  so the crate-level deny guarantees none of it compiles by default. The
  io-uring reactor and fs::uring are also behind a non-default feature.

Network, filesystem, process and FFI sites, by module: net/* (tcp, udp, unix,
dns, quic_native, atp), http/grpc/web/messaging (nats, redis, kafka),
database, tls, fs/*, process.rs and signal/*. All compile by default on
non-wasm targets, because no feature gates them out, and all run only when
the caller uses that API. With default features off, cli/, database and the
atp/benchmark adapters are excluded (whoami/num_cpus come only from
`benchmark-adapters`). Non-test Command::new sites: process.rs (the public
process API), atp daemon_control (daemon or taskkill), net/atp/bonding
(`tailscale status --json` / `tailscale ip -4`, only through
`detect_local_tailnet`), agent_swarm/release_proof_aggregator and
lab/benchmark_cartel (`git rev-parse` and friends, local only). All other
spawn sites are in `mod tests` or in test-internals-only modules. The only
extern block is Windows Kernel32 CompareStringOrdinal, plus a wasm-only
queueMicrotask binding. Hard-coded remote addresses are opt-in public-DNS
constructors (`ResolverConfig::google()` / `cloudflare()`) and a UDP
connect-without-send route probe to 1.1.1.1 / 2001:4860:4860::8888 in the atp
sdk diagnostics. The OTLP exporter needs a caller-given endpoint. The web
debug dashboard (include_str of assets/dashboard.html) fetches only
same-origin /debug/snapshot. Env-driven runtime config is opt-in
(`RuntimeBuilder::with_env_overrides`). gf256 reads ASUPERSYNC_GF256_* env
vars to select a kernel.

Lab path: the deterministic lab runtime itself does no I/O. The lab-test
harness helpers (`run_*_lab_test*` and `write_auto_crashpack_for_*`) write
crashpack files for a failed test into `./target/test-artifacts` (or
ASUPERSYNC_TEST_ARTIFACTS_DIR). This is on by default, and
ASUPERSYNC_AUTO_ARTIFACTS=0 turns it off. `deterministic-mode` is an empty
feature that only switches lab oracles to a deterministic clock.

Telemetry and license enforcement: we searched for OpenAI/Anthropic/
licensee/rider strings, hostname, username, whoami, machine-id, hard-coded
URLs and IPs, and long encoded blobs. We found no code that identifies or
reports who uses the crate. The license rider is text in LICENSE only.
cli/upgrade.rs holds GitHub release URLs as strings but makes no request.
include_bytes!/include_str! otherwise load test fixtures under cfg(test).
This crate is not a proc-macro. asupersync-macros is a separate, optional
package (`proc-macros`, a default feature).

Not opened beyond grep: atp/* and net/atp/* transports (most of the line
count), quic_native, http, grpc, web, messaging, database, tls, distributed,
obligation, plan, trace, observability, codec, combinator, actor,
supervision, spork, agent_swarm, cli, bin/, raptorq except the gf256 gating,
and lab/* except runtime.rs artifact paths, config.rs and benchmark_cartel.rs.
"""

