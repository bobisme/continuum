stability; every side effect is a `cargo:rustc-cfg=...`/`cargo:rustc-check-cfg=...`
line or a write inside OUT_DIR, no network, no writes outside OUT_DIR. Read
src/ptr.rs in full (11/11 unsafe): a small `Own`/`Ref`/`Mut` raw-pointer newtype
layer (NonNull<T> plus lifetime phantoms) that concentrates every raw
dereference behind four one-line methods (`deref`, `deref_mut`, `read`,
`boxed`). Read src/fmt.rs (6/6) and src/ensure.rs (7/7 — one real unsafe pair:
an internal no-alloc buffer formatter using `ptr::copy_nonoverlapping` bounded
by its own tracked `written` length, then `str::from_utf8_unchecked`; the rest
of ensure.rs's "unsafe" hits are macro_rules! token matching on the literal
`unsafe` keyword in user expressions, not executed unsafe code) and
src/context.rs (1/1) in full. Sampled src/error.rs (~79 unsafe sites): this is
anyhow's well-known type-erased `ErrorImpl`/`ErrorVTable` design — a hand-built
vtable (function-pointer table for drop/ref/boxed/downcast/backtrace) read from
the first word of the allocation via `vtable(p)`, with every `object_*<E>`/
`context_*<C,E>` unsafe fn paired at the type level with the exact `E`/`C` that
was erased so restoration is type-correct by construction; this is the same
technique anyhow has shipped and had reviewed for years, not novel or
undisclosed. Confirmed zero `std::process::Command`, no network types, no
`include_bytes!`/`include_str!` reaching outside the crate's own docs, no
`env::var` outside build.rs. Matches documented purpose (a small, ubiquitous
error-boxing crate); no backdoor indicators.
"""

