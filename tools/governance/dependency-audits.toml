[[audits.bincode-next]]
version = "3.1.1"
checksum = "1d6626829353ae29293be5c86f42de5f0468bc758af074b0c7d08f07e538ccbc"
who = "continuum-dev"
criteria = ["safe-to-deploy"]
notes = """
"bincode-next" (Cargo.toml.orig repository = github.com/Apich-Organization/bincode,
authors retain the original bincode maintainers Ty Overby/Zoey Riordan/Victor
Koenders plus new steward Xinyu Yang) is, per its own README, "a modernized
fork of the original `bincode` library, maintained by the Apich Organization to
ensure continued development" — not a hijack of the `bincode` name, a
declared, credited continuation under a new crate name. Read build.rs in full:
13 lines, an `rustc -vV`-based nightly-channel probe emitting one
`cargo:rustc-cfg=is_nightly`; no network, no writes outside cfg emission.
19005 src LOC, unsafe_kw=146; sampled ~85 of 146 directly with context,
prioritizing raw-pointer/transmute/asm sites over bounds-checked indexing:
  - src/de/async_fiber.rs (45/146, read in full): a custom stackful-fiber
    ("Unified Fiber-backed Async") coroutine runtime — mmap/VirtualAlloc
    guard-paged stacks, hand-written per-ISA `#[unsafe(naked)]` context-switch
    assembly (x86_64 SysV/Win64, aarch64 unix/Windows, riscv64), and
    `unsafe impl Send/Sync for BridgeFuture`. The module's own doc comment is a
    "CRITICAL SAFETY WARNING" admitting that a `Decode` implementation using
    thread-locals or `!Send` types under executor thread migration is
    undefined behavior that the compiler cannot catch — a genuine, disclosed
    caller-obligation hazard, well outside the risk profile of a typical
    serialization crate. This entire module is gated behind the `async-fiber`
    Cargo feature (pulled in further by `tokio`/`full`), which is confirmed
    NOT in `default = ["std", "derive", "simd"]` (Cargo.toml `[features]`).
    This audit does not certify `async-fiber`/`tokio`/`full` to the
    safe-to-deploy bar; a human must review src/de/async_fiber.rs specifically
    before any workspace Cargo.toml enables those features.
  - src/features/relative_ptr.rs (~15/21 sampled): a zero-copy relative-pointer
    system (`RelativePtr`, `ZeroArray`, `ZeroSlice`, `ZeroStr`, an unsafe
    `ZeroCopy` marker trait) doing unaligned reads and buffer-bounded pointer
    arithmetic with provenance carried from the caller's buffer slice — the
    same category of unsafe as rkyv/zerocopy. Gated behind the non-default
    `zero-copy` feature.
  - src/features/impl_alloc.rs (~20/23 sampled): bulk `Vec<T>`
    encode/decode for primitive element types via `Vec::with_capacity` +
    raw-pointer `read`/`write` + `set_len`, plus x86_64/aarch64 manual
    prefetch intrinsics — the standard "skip per-element push" fast path
    used by most performance-oriented (de)serializers.
  - src/varint/simd.rs (3/3, read in full): SSE2/NEON/RVV SIMD varint-length
    scanning intrinsics, each gated by `#[cfg(feature = "simd")]` and a
    length check before the unaligned load.
  - extern_C=10: all in async_fiber.rs, `unsafe extern "C" fn switch_context`
    ABI markers on the naked-asm functions above (feature-gated, non-default)
    plus one doc-comment example lifted from `core::mem::MaybeUninit`'s own
    documentation pattern (de/impl_core.rs:134, never compiled).
  - net=13 (TSV; full-crate grep finds 18, src-only): every hit is either a
    `Fingerprint`/`Encode`/`Decode` impl for `std::net::{IpAddr, Ipv4Addr,
    Ipv6Addr, SocketAddr, SocketAddrV4, SocketAddrV6}` (bincode supporting
    serialization of these standard library types — an ordinary feature, not
    outbound I/O), or the `is_compact_net()` config accessor name / a doc
    comment saying "network encoding". No socket, DNS, or HTTP calls exist
    anywhere in the crate.
  - include_str! hits are `#![doc = include_str!("../docs/spec.md")]` and
    three siblings (migration guide, README, derive readme) — rustdoc content
    embedding only.
No `std::process::Command`, no `env::var` outside build.rs. Default-feature
surface (`std`, `derive`, `simd`) is reviewed and matches documented purpose;
see CONCERNS for the async-fiber/zero-copy carve-out.
"""

