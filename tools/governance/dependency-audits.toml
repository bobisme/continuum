Acquire/Release ordering in `set_logger_inner`, and a losing-thread spin-loop
on `STATE.load(Ordering::Relaxed) == INITIALIZING`. This is the standard
compare_exchange-gated once-init pattern (the same shape std's own `Once`
uses); the write to `LOGGER` only happens in the branch that won the CAS, and
`logger()` reads it only after observing `STATE == INITIALIZED` via an Acquire
load. `set_logger_racy`/`set_max_level_racy` are explicit `unsafe fn` with
doc-stated caller obligations (no concurrent init), not silently unsound. Read
all 8 unsafe occurrences plus the CAS logic around them. The `net = 22`
signal in the source manifest is `std::net::{IpAddr, Ipv4Addr, ...}` used only
as enum variants of the `kv`-feature `Value` type (structured-logging value
representation) in src/kv/value.rs — declarations and doc-tests, no socket I/O.
No build script, no filesystem/process access.
"""

