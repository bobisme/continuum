notes = """
dtolnay's anyhow, a dynamic error type with context chaining. Read build.rs in
full: it probes `rustc --version` and runs a `--cfg=anyhow_build_probe` compile
probe (via `rustc ... --emit=dep-info,metadata --out-dir <OUT_DIR>/probe`,
