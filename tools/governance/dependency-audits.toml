[[audits.zmij]]
version = "1.0.23"
checksum = "29666d0abbfad1e3dc4dcf6144730dd3a3ab225bbbdac83319345b1b44ccfc1b"
who = "continuum-dev"
criteria = ["safe-to-deploy"]
notes = """
Cargo.toml.orig: author David Tolnay, repository github.com/dtolnay/zmij,
description "A double-to-string conversion algorithm based on Schubfach and
xjb" — this is dtolnay's own float-to-string formatting crate (a sibling of
his `ryu`, which is pulled in as a dev-dependency for comparison testing),
the unfamiliar name is simply this crate's chosen name, not an unrelated or
suspicious rename. Read build.rs in full: an `rustc -vV`-based nightly-probe
emitting `cargo:rustc-cfg=is_nightly`; no network, no filesystem writes
outside cfg emission. 2088 LOC, unsafe_kw=70 (the highest density in this
slice, ~1 per 30 lines) — sampled roughly 30 of the 70 directly, covering
every category present: src/stdarch_x86.rs (read in full, 4/4) reimplements
`_mm_set_epi8/16/32/64x` as `const fn` via `mem::transmute` from integer
arrays, needed because the real `core::arch::x86_64` intrinsics of the same
name are not `const fn` on stable — a standard, narrowly-scoped workaround;
src/lib.rs's remaining unsafe is `get_unchecked`/pointer-offset reads into
statically-bounded power-of-ten lookup tables (`POW10_MINOR`/`POW10_MAJOR`/
`POW10_FIXUPS`), SIMD digit-shuffle writes gated by
`#[cfg(target_feature = ...)]` (SSE4.1/SSE2/NEON), `mem::transmute` building
`int32x4_t`/`int16x8_t` SIMD constants from integer arrays (same pattern as
stdarch_x86.rs), and `asm!("/*{}*/", ...)` used only as an empty compiler
barrier (forcing register/instruction-scheduling behavior, not executing any
real assembly instruction) — the same well-known trick used throughout
performance-sensitive Rust code. All of this is inherent to a SIMD-optimized
float-formatting algorithm and structurally matches itoa/ryu from the same
author elsewhere in this slice. No I/O, network, or process access; no
`include_bytes!`/`include_str!`.
"""
