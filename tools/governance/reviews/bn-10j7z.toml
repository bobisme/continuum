[change]
bone = "bn-10j7z"
author = "continuum-dev"
summary = "continuum-cml-elab: RFC 0003 correction 4 part B — enumeration-typed state and scalar codes, action schemas (one action per parameter tuple, named A(p=u,…), instances and widest name preflighted in aggregate), membership in set literals and constant sets, and planned quantifier expansion (whole type, static set, state-dependent set guarded by membership over an interval hull) with one plan/build code path that charges each site's output and checks its depth and predicted work before building; new typed refusal cml.lower.guarded_overflow"

