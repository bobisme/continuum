[semantic.claim_impact]
claims = ["C021", "C022"]
reason = "action schemas and finite quantifier expansion are what corpus ports with parameterized actions and quantified invariants need before they reach an engine (C021) and part of the expressiveness C022 claims; this change adds evidence toward both (quantified invariants agree with a brute-force oracle, a schema equals its programmatic twin) and promotes neither: both stay TARGET, and collection-valued state and the replicated register (bn-23hzh) still do not lower"

[semantic.schemas]
updated = []
reason = "no schema document changes: the run configuration is read as bn-15zfa left it; the lowered Model type and continuum-model/1 identity are unchanged"

[semantic.migration]
verdict = "Preserved"
note = "continuum-model-core is unchanged, and so is every continuum-model/1 identity (tests/identity_golden.rs). continuum-cml-elab: every model that lowered before lowers to the same Model (the plan/build split charges the same output for quantifier-free expressions; plain actions now also charge their names as output, and every appended record (variable, predicate, action instance, relational candidate, initial state) is charged one node with its owned name, update targets' names, and initial-state bindings, so Usage figures rise; under the default output budget an init enumeration past about 2^20 output nodes of bindings is now refused as cml.lower.output_too_large, before the MAX_INIT_BINDINGS bound (cml.lower.too_many_initial_states), which still applies under a larger budget, and a parameterized action is refused in the preflight rather than in the action loop, with the same code and span). Models that were refused as cml.lower.quantifier or cml.lower.parameterized_action, and enumeration-typed state refused as cml.lower.non_integer_state, now lower when their domains are finite; no stored artifact records those refusals. Unlowerable::GuardedOverflow is new surface"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-3aqchd"
verdict = "approved"
