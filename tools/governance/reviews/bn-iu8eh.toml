[change]
bone = "bn-iu8eh"
author = "continuum-dev"
summary = "the kernel's wire-epoch-2 finite-closure check reads definedness (RFC 0003 Definedness, RFC 0013 Undefined): continuum-kernel-core classifies the carried model's X#defined chains with its own code by the rule continuum_model_core::definedness states (a chain guards the predicate its base names only when every name of it is a declared predicate, no name is an action's name or the schema of an instance X(...), and none contains '('; every other chain is an action's, fail closed), and step 4 of check_model_closure rejects a table state where an action chain member is false (Rejection::UndefinedActionRead) or, for an invariant claim, where a member of the invariant's chain is false or the invariant is itself a false definedness predicate (Rejection::UndefinedInvariantRead), with the reference engine's precedence: evaluation fault, undefined action read, undefined invariant read, violation; the classification and the scan are precharged"

[semantic]
covers = [
  "crates/continuum-kernel-core/src/definedness.rs",
  "crates/continuum-kernel-core/src/check.rs",
  "crates/continuum-kernel-core/src/model.rs",
  "crates/continuum-kernel-core/src/verdict.rs",
  "crates/continuum-kernel-core/src/lib.rs",
]
reference_tests = [
  "crates/continuum-kernel-core/src/check.rs::an_undefined_action_read_at_a_table_state_is_rejected_under_every_claim",
  "crates/continuum-kernel-core/src/check.rs::an_undefined_invariant_read_refutes_only_its_invariant",
  "crates/continuum-kernel-core/src/check.rs::a_deeper_chain_member_is_read_first",
  "crates/continuum-kernel-core/src/check.rs::an_ill_formed_chain_is_read_as_an_actions_and_fails_closed",
  "crates/continuum-kernel-core/src/check.rs::precedence_is_fault_then_action_then_invariant_then_violation",
  "crates/continuum-kernel-core/src/check.rs::the_definedness_scan_is_charged_before_any_evaluation",
  "crates/continuum-kernel-core/src/definedness.rs::a_well_formed_chain_guards_its_base_deepest_first",
  "crates/continuum-kernel-core/src/definedness.rs::a_gap_a_collision_or_an_instance_name_reads_the_chain_as_an_actions",
  "crates/continuum-engine-reference/tests/kernel_definedness_differential.rs::every_named_case_of_the_rule_agrees",
]
metamorphic_tests = [
  { test = "crates/continuum-kernel-core/src/check.rs::metamorphic_alpha_renaming_a_chain_with_its_base_keeps_the_verdict", relation = "alpha-renaming" },
]
differential_tests = [
  { test = "crates/continuum-engine-reference/tests/kernel_definedness_differential.rs::the_kernel_classifies_definedness_chains_as_the_model_core_does", oracle = "continuum-model-core", subject = "continuum-kernel-core" },
  { test = "crates/continuum-engine-reference/tests/c018_kernel_evaluator_differential.rs::the_kernel_and_the_model_core_agree_on_every_random_model", oracle = "continuum-engine-reference", subject = "continuum-kernel-core" },
]

[semantic.claim_impact]
claims = ["C018"]
reason = "C018: a wire-epoch-2 finite-closure or invariant certificate over a model with an undefined read at a table state no longer verifies, from any producer; the reference engine already refused to emit one (bn-24a5c). The checking base grows (a definedness module and two rejection variants), the checker campaign gains six lies (an undefined action read, an undefined invariant read, and one fail-closed chain per clause of the rule: a gap, a name with '(', an action's name, an instance's schema), the source-mutation lane gains six killed mutants (the two reporting arms and four classification clauses) and rewrites the invariant-rule mutant for the new code, and the TCB audit evidence is regenerated by tools/check_tcb_audit.py --evidence; the claim state stays OBSERVED and the docs/18 row is unchanged"

[semantic.schemas]
updated = []
reason = "no schema document changes: the certificate wire form, the model identity and proof-receipt.schema.json are unchanged; the two new rejections are in-crate Rust values whose reason tokens (undefined-action-read, undefined-invariant-read) travel in the existing open rejection-reason string, as every other kernel rejection token does"

[semantic.migration]
verdict = "Revalidate"
note = "continuum-kernel-core: Rejection gains UndefinedActionRead and UndefinedInvariantRead (an exhaustive match in a caller must add arms; the one in-tree consumer, the wire fuzz landing vocabulary, lists both). A wire-epoch-2 certificate over a model with no definedness predicate gets the same verdict as before, with one retyping: a model-bound invariant claim whose predicate is false at an earlier table state and faults at a later one is now EvaluationOverflow (the fault wins, as in the reference engine) instead of InvariantViolated; both are rejections. A second retyping: an invariant claim false at an earlier table state that hits evaluator depth exhaustion (Fault::DepthExhausted) at a later one was Rejected(InvariantViolated) and is now Unsupported(ExpressionDepth), matching the reference scan (cr-2l7edb th-flfuv5). A certificate over a model with a false X#defined at a table state, which verified before, is now rejected, so stored verdicts over such models are revalidated. Wire epoch 1 carries no model and is unchanged; its claim still names certificate-model-correspondence, which covers definedness there"

[kernel]
covers = [
  "crates/continuum-kernel-core/src/definedness.rs",
  "crates/continuum-kernel-core/src/check.rs",
  "crates/continuum-kernel-core/src/model.rs",
  "crates/continuum-kernel-core/src/verdict.rs",
  "crates/continuum-kernel-core/src/lib.rs",
]

[kernel.mutation_tests]
tests = [
  "crates/continuum-kernel-core/src/check.rs::an_undefined_action_read_at_a_table_state_is_rejected_under_every_claim",
  "crates/continuum-kernel-core/src/check.rs::an_undefined_invariant_read_refutes_only_its_invariant",
  "crates/continuum-kernel-core/src/check.rs::an_ill_formed_chain_is_read_as_an_actions_and_fails_closed",
  "crates/continuum-certificate/tests/c018_checker_mutation.rs::no_lie_verifies",
  "crates/continuum-certificate/tests/c018_checker_mutation.rs::every_lie_is_rejected_for_the_reason_it_targets",
  "crates/continuum-engine-reference/tests/kernel_definedness_differential.rs::the_kernel_classifies_definedness_chains_as_the_model_core_does",
]
classes = ["body.value-perturbation"]

[kernel.code_size]
total = 13265
budget = 15000
note = "continuum-kernel-core grew: a new crate-private definedness module (the chain classifier, its two precharge functions and their docs), three model accessors in model.rs (predicate count, predicate name bytes, predicate lookup by bytes) and an action-or-schema lookup, two Rejection variants with their reason tokens in verdict.rs, and the definedness step with its first_false and fault_verdict helpers in check.rs; the other three kernel crates are unchanged"

[kernel.no_unchecked_optimization]
is_optimization = false
reason = "no optimized path: the change adds a check (one more obligation per table state) and a precharge for it; name lookups are binary searches over the decoder's strictly ascending action and predicate names, which the decoder already guarantees and the differential test exercises, and no existing obligation is skipped, reordered or weakened"

[kernel.fuzz_corpus]
files = ["crates/continuum-certificate/tests/c018-corpus/cases.txt"]
test = "crates/continuum-certificate/tests/c018_checker_mutation.rs::the_committed_corpus_replays_with_its_recorded_verdicts"

[kernel.reviewers]
entries = [
  { reviewer = "continuum-security", review = "cr-2l7edb", verdict = "approved" },
  { reviewer = "continuum-kernel-review", review = "cr-2l7edb", verdict = "approved" },
]

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-2l7edb"
verdict = "approved"
