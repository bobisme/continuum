[semantic.claim_impact]
claims = ["C002", "C033"]
reason = "Neither row's state or wording changes. C002 (crashpacks replay exactly within a semantic epoch) stays TARGET: gate 1 checks a replay payload's exactness against a recorded run, but no crashpack producer exists and there is no retained replay corpus in clean processes. C033 stays TARGET: gates 1 and 4 are two of the ten Phase B gates, and no repair is promoted yet"

[semantic.schemas]
updated = []
reason = "no schema document changes: evaluation_policy, an already-declared string field, carries the policy token; gates[].evidence is filled with crash_, ev_ and defect_ handles that match the already-declared evidence pattern, and status is derived evaluating, an existing enum member; the three evaluated versions validate against the epoch-1 schema in validate_dossier.py"
unaffected = { repair-transaction = "the crate still emits epoch-1 instances; no field, enum, pattern or conditional moves", crashpack = "the RecordedRun record is the replay payload a crashpack manifest names by string; the manifest's shape is not touched", promotion-receipt = "receipt.rs changes only in its unit tests, which copy a gate list that is no longer Copy; no receipt field or shape moves" }

[semantic.migration]
verdict = "Preserved"
note = "No published artifact, schema class or epoch moves: continuum-repair still writes epoch-1 repair-transaction instances, begin and apply build byte-identical versions (every IMPL-01, IMPL-02 and PR-22 fixture is unchanged), and no daemon path serves repair.evaluate yet (bn-23pwm). The crate API changes in continuum-repair only: Gate is Clone, not Copy, and carries evidence; RepairTransaction gains evaluation_policy (the policy token, plus the authorization digest for an authorized policy; recorded by evaluate, cleared by apply, absent from begin and apply artifacts so their bytes do not move); RepairTransaction::status is no longer const and derives evaluating once an in-profile gate has an outcome; the replay module (with the Replayer trait, PolicyAuthorization, whose constructor is crate-private and test-only, and the NoAuthority seam request_continue_and_disclose) and EvidenceRef are new; evaluate takes Option<&PolicyAuthorization> and no caller-chosen policy"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-1f5td2"
verdict = "approved"
