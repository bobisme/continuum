[change]
bone = "bn-2pla"
author = "continuum-dev"
summary = "PR-20 / IMPL-03, exact replay: continuum-repair's replay module evaluates RFC 0032 gates 1 and 4 from the transaction's crashpack, whose bytes must re-derive to its crash_ handle. The base replay passes only on the byte-identical run; the recorded failure absent fails; the failure reproduced without the recorded run, or a divergence, is inconclusive with a defect_. The candidate replay runs under the fail-closed Exact policy unless a PolicyAuthorization bound to the version's rt_ identity, snapshots and base intent is checked against it; nothing in production issues one yet (request_continue_and_disclose answers NoAuthority; owners bn-2vanm and bn-b6u4). Under Exact a clean run with eliminated or reordered steps is inconclusive; a failure fails; a divergence is inconclusive. Evaluated gates are recorded with crash_/ev_/defect_ evidence records that bind the replayer, the policy, the status and the typed INV-008 reason, Unsupported included, and the recorded evaluation_policy (with the authorization digest when authorized) is part of the rt_ identity"

