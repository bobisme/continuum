[semantic.claim_impact]
claims = []
reason = "no docs/18 claim row covers incremental reuse or its parity audit; this spike is the PR-22A build-vs-adopt evidence (docs/08 R21) and moves no claim's evidence state"

[semantic.schemas]
updated = []
reason = "no schema document changes: query keys, reuse records, and the explain result are crate-level values; the spike builds no wire projection of the explain result (rule query.invalidation_edges is an ADR residual) and the daemon wire is untouched"

[semantic.migration]
verdict = "Preserved"
note = "continuum-incremental was a documented stub; this adds its first public surface (vocab, query, engine, explain, audit, output) and five workspace path edges (cml-syntax, cml-elab, engine-reference, certificate, value). No existing crate, type, wire value, schema, or published artifact changes"

