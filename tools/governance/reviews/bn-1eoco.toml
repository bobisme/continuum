[change]
bone = "bn-1eoco"
author = "continuum-dev"
summary = "continuum-incremental's engine and its independent audit read the whole definedness chain via continuum-model-core's Definedness (bn-24a5c's fail-closed, collision-checked rule), not a re-implemented depth-1 scan: check_invariant, domain_safety, and the Validated witness's engine-side scan (assumption V1) call Definedness::of directly (engine.rs), and the audit calls the same function independently of the engine's decision logic (audit.rs, tests/independence.rs still pins its imports), so a nested chain, a gap, or an action-name collision classifies the same way on every path that reads one. tests/differential.rs's comparison with engine-reference's CheckOutcome::Undefined is real for whatever chain shape the oracle reports, gains a two-actions case and an alpha-renaming metamorphic test, and the depth-1 scope note is removed from the test and from lib.rs. Nested chains, gaps, and collisions — shapes only a hand-built model can carry, since CML lowering never writes one — are covered where they can be built: new differential unit tests in engine.rs's and audit.rs's own test modules, each checked against continuum-engine-reference's own checking::check"

[semantic]
covers = [
  "crates/continuum-incremental/src/",
]
reference_tests = [
  "crates/continuum-incremental/src/engine.rs::a_false_guard_of_a_guard_is_undefined_in_the_engine_too",
  "crates/continuum-incremental/src/engine.rs::a_false_guard_of_an_action_guard_is_undefined_action_in_the_engine_too",
  "crates/continuum-incremental/src/engine.rs::a_chain_with_a_gap_fails_closed_in_the_engine_too",
  "crates/continuum-incremental/src/engine.rs::a_chain_through_an_action_name_fails_closed_in_the_engine_too",
  "crates/continuum-incremental/src/engine.rs::a_nested_evaluation_error_is_reported_in_the_engine_too",
  "crates/continuum-incremental/src/audit.rs::a_false_guard_of_a_guard_is_undefined_in_the_audit_too",
  "crates/continuum-incremental/src/audit.rs::a_false_guard_of_an_action_guard_is_undefined_action_in_the_audit_too",
  "crates/continuum-incremental/src/audit.rs::a_chain_with_a_gap_fails_closed_in_the_audit_too",
  "crates/continuum-incremental/src/audit.rs::a_chain_through_an_action_name_fails_closed_in_the_audit_too",
  "crates/continuum-incremental/src/audit.rs::a_nested_evaluation_error_is_reported_in_the_audit_too",
  "crates/continuum-incremental/src/audit.rs::undefined_action_reports_the_chains_base_name",
  "crates/continuum-incremental/tests/differential.rs::undefined_reads_agree_with_the_reference_engine_run_directly",
]
metamorphic_tests = [
  { test = "crates/continuum-incremental/tests/differential.rs::alpha_renaming_the_two_actions_case_preserves_its_undefined_outcome", relation = "alpha-renaming" },
]
differential_tests = [
  { test = "crates/continuum-incremental/tests/differential.rs::undefined_reads_agree_with_the_reference_engine_run_directly", oracle = "continuum-engine-reference", subject = "continuum-incremental" },
  { test = "crates/continuum-incremental/tests/differential.rs::every_reused_exploration_and_verdict_equals_the_reference_engine_run_directly", oracle = "continuum-engine-reference", subject = "continuum-incremental" },
]

