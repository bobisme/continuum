reason = "no docs/18 claim row covers incremental reuse or its parity audit (bn-31vf's own record states the same); this closes the depth-1 gap bn-24a5c's follow-up (bn-1eoco) named against the incremental engine, and moves no claim's evidence state"

[semantic.schemas]
updated = []
reason = "no schema document changes: InvariantVerdict, DomainSafety and the canonical encoders in output.rs are unchanged in shape (UndefinedAction still carries one action name, a depth and a state) — only which predicates the scan that fills them reads changes, from a depth-1 lookup to the whole chain"

[semantic.migration]
verdict = "Revalidate"
note = "continuum-incremental: every model the CML front end lowers still has depth-1, collision-free definedness chains (no declared name can contain '#', and lowering never nests a chain), so check_invariant, domain_safety and the Validated witness's engine-side scan report the identical InvariantVerdict/DomainSafety outcome for every source this crate has ever accepted; the differential and reuse-spike goldens are unchanged. Work accounting is not byte-identical: the 'action definedness guards'/'classify guards' charge that prices Definedness::of, and the per-invariant 'check invariant' charge (now sized by that invariant's own chain depth rather than a fixed two evaluations), both move — a source already near Limits::work could see a different (never smaller, per the charge-before-work rule) accounting, though not at the 2^36 default. Behaviour changes only for a hand-built continuum_model_core::model::Model with a nested chain, a gap, or a name collision, which neither Engine::revise nor audit::clean can receive today (both take CML source text only) — the new engine.rs/audit.rs unit tests are the first exercise of that path, and it now reports the same typed outcome continuum-engine-reference does instead of continuing to treat the chain as depth-1. Cargo.toml gains a direct continuum-model-core path dependency (already reachable transitively through continuum-engine-reference and continuum-cml-elab); Cargo.lock is regenerated, no external crate is added; tools/governance/dependency-rationale.toml's continuum-model-core entry gains continuum-incremental in used_by"

