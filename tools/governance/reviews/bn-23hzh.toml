  "crates/continuum-cml-elab/tests/collections.rs::collection_actions_agree_with_the_oracle_on_every_canonical_state",
  "crates/continuum-cml-elab/tests/collections.rs::keys_that_read_state_are_dynamic_keys",
  "crates/continuum-cml-elab/tests/collections.rs::static_values_outside_the_universe_are_refused",
