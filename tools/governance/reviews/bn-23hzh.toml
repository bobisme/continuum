[change]
bone = "bn-23hzh"
author = "continuum-dev"
summary = "continuum-cml-elab: RFC 0003 correction 4 part C — flat bounded-integer layouts for Option, tuple, Set, and Map state (slots named by path, canonical init candidates only, whole-layout writes), static-key selection, collection expressions lowered slot by slot at an explicit type, collection-typed parameters, binders, and quantifier domains, and map reads kept as the definedness predicates A#defined and I#defined (a typed undefined-read outcome, never a default); the replicated register lowers to 14 slots and 50 actions and agrees with an independent simulation; new typed refusals cml.lower.dynamic_key, value_outside_bound, dynamic_value, duplicate_key, and undefined_read; every planned site now spends exactly its prediction"

