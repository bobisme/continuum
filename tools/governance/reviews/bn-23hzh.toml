[semantic.claim_impact]
claims = ["C021", "C022"]
reason = "collection-valued state is what the replicated register and other corpus models need before they reach an engine (C021) and part of the expressiveness C022 claims; this change adds evidence toward both (the register lowers, the reference engine explores it, and its reachable states, transitions, invariant verdicts, and undefined reads equal an independent simulation's; collection invariants and actions agree with a brute-force oracle on every canonical state) and promotes neither: both stay TARGET, and fairness (bn-1ln12) still does not lower"

[semantic.schemas]
updated = []
reason = "no schema document changes: the run configuration is read as bn-15zfa left it; the lowered Model type and continuum-model/1 identity encoding are unchanged (a composite variable becomes ordinary bounded-integer variables)"

[semantic.migration]
verdict = "Preserved"
note = "continuum-model-core is unchanged, and so is the continuum-model/1 encoding (tests/identity_golden.rs). continuum-cml-elab: every model that lowered before lowers to the same Model, except that a sort element whose name holds `{`, `}`, or `:` now has that byte escaped in action labels (bn-10j7z escaped only `\\ , = ( ) [ ]`), and a variant name of a hand-built model is now escaped the same way, which changes those labels and so those identities; no stored artifact records one. Usage figures rise: a site now spends the whole of its predicted work (the rest when it closes), so a lowering replays under its reported limits. Models refused as cml.lower.non_integer_state (collection state), cml.lower.parameterized_action (a collection parameter), or cml.lower.quantifier (a collection binder, a comprehension) under a configuration now lower when their types are finite, or are refused with one of the new typed codes; unconfigured lowering keeps its refusals. The five new Unlowerable variants and lower::definedness_subject / DEFINED_SUFFIX are new public surface"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-2ee1cw"
verdict = "approved"
