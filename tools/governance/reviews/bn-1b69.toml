[change]
bone = "bn-1b69"
author = "continuum-dev"
summary = "continuum-repair: PR-20 / IMPL-04 semantic and intent diff. diff::compute builds a repair transaction's one RFC 0031 diff_* artifact between base and candidate from the stores (snapshot bindings, intent registry, evidence scope) with continuum-semantic-diff's assembler unchanged; a candidate that changes protected intent or rebinds to another intent is a privileged intent revision (gate 3 failed), an undiffable input is a typed INV-008 inconclusive, and a claimed diff or handle that is not the computed one is refused. Program-side changes are not classified (no classifier exists), so the diff is assembled under continuum-semantic-diff's new ProgramLayer::Unclassified: no scoped evidence is reused and a repair's gate 3 is inconclusive (Unsupported), so gate 3 cannot pass today for any candidate that changes the workspace. The program layer is bound into the diff_ identity by a versioned domain-separation tag (semantic-diff/program-layer/{classified,unclassified}/v1), and gate_status_of_cached is the only path from stored bytes to a gate status: it recomputes from the stores and refuses a layer mismatch typed"

