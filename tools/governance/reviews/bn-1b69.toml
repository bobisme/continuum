[semantic.schemas]
updated = []
reason = "no schema document changes, and none is invented: semantic-diff.schema.json has no field that can say the program-side layer was not classified (semantic_changes items carry a closed seven-axis kind and every object is closed), so that fact is typed on the Rust side (DiffArtifact::program_layer) and shows on the wire only as an empty semantic_changes and an impact with nothing reused; a typed wire marker is raised as a schema follow-up. The impact arrays carry bare artifact ids with no cause token, so the wire cannot name ProgramLayerUnclassified either; the layer reaches the bytes only through the tagged diff_id. Also: the diff is an instance of the existing semantic-diff.schema.json, and the two retained artifacts are validated against it by validate_dossier.py; the repair-transaction artifact's bytes do not move, because writing its semantic_diff field belongs to the evaluation path"
unaffected = { semantic-diff = "artifact.rs gains assemble_under and a typed program_layer that is not rendered; the wire bytes of every artifact are unchanged, and an unclassified program layer moves impact entries only between the existing reused and unknown arrays", promotion-receipt = "receipt.rs gains two read accessors on RegisteredIntent; no receipt field, byte or refusal changes" }

[semantic.migration]
verdict = "Preserved"
note = "continuum-repair gains the diff module and two read accessors on receipt::RegisteredIntent; no existing continuum-repair type, artifact byte or refusal changes. continuum-semantic-diff gains additive API: ProgramLayer, UnknownCause::ProgramLayerUnclassified, compute_impact_under, assemble_under and DiffArtifact::program_layer; compute_impact and assemble keep their signatures and outputs (ProgramLayer::Classified), so existing callers and artifacts are unchanged. A caller that matches UnknownCause exhaustively must add the new variant; none exists in the workspace."

[semantic.claim_impact]
claims = ["C020", "C033"]
reason = "Gate 3 cannot pass today for any candidate that changes the workspace, because no program-side classifier exists; that is stated, not hidden. C020 (agent repairs do not weaken properties or assumptions silently) is the claim this bears on: a repair transaction's candidate is now classified by the same RFC 0031 classifier C020's hidden-mutant evaluation runs, and any intent change or rebinding is a privileged intent revision rather than a repair. The evidence is library-grain: no production path calls diff::compute yet (repair.evaluate and the daemon's stores are unwired), so no row changes state or wording. C033 is the TARGET the repair path eventually serves; nothing here moves it."

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-3psesg"
verdict = "approved"
