[change]
bone = "bn-18w74"
author = "continuum-dev"
summary = "Signing custody across restart (plan 18.6, ADR-0054): continuum-evidence gains SigningCustodyState and the SigningCustody capability; continuumd records every signing change through it before the change takes effect, keeps its own keys apart from the registry's signers, and re-validates a restored state in Builder::launch_signing, and reports an unconfirmed commit as OutcomeUnknown (protocol 3.9, IDL 1.17); continuum-security's LocalKeystore persists it atomically with descriptor-bound, bounded, fail-closed reads"

[semantic]
covers = [
  "crates/continuum-evidence/src/signing.rs",
]
reference_tests = [
  "crates/continuumd/tests/signing_custody.rs::a_restart_keeps_rotations_revocations_and_adopted_links",
