  "crates/continuum-security/tests/keystore.rs::a_write_reports_which_side_of_the_rename_it_failed_on",
  "crates/continuum-security/tests/keystore.rs::a_persisted_rotation_round_trips_and_removes_the_retired_key",
  "crates/continuum-security/tests/keystore.rs::a_truncated_extended_or_garbage_state_file_fails_closed",
