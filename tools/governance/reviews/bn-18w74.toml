  "crates/continuumd/tests/signing_custody.rs::a_state_that_does_not_hold_is_refused_before_any_key_is_used",
  "crates/continuumd/tests/signing_custody.rs::a_restored_state_without_room_to_recover_is_refused",
  "crates/continuumd/tests/signing_custody.rs::an_exposed_or_symlinked_store_is_refused_at_launch",
  "crates/continuumd/tests/signing_custody.rs::a_custody_that_refuses_a_write_changes_nothing_and_stops_signing",
