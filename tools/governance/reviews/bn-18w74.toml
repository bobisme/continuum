[semantic.claim_impact]
claims = []
reason = "no docs/18 claim row covers signing, signatures, key custody, or provenance verification; this change makes the signing authority survive a restart and keeps TEST-9-07 enforced with more bound evidence, neither of which is a docs/18 claim row"

[semantic.schemas]
updated = []
reason = "no JSON schema document changes; the keystore's state file is a private on-disk format of continuum-security, not a machine contract under notes/plan/schemas, and every signed encoding is unchanged. The wire changes additively (cr-33e464, user-approved): protocol 3.8 to 3.9 and IDL 1.16 to 1.17 add ErrorCode OutcomeUnknown @since(3.9), never retryable, to the error clauses of signing.mint, signing.rotate, signing.revoke and intent.import_bundle, and add rule signing.custody (RFC 0026 correction 60)"

[semantic.migration]
verdict = "Preserved"
note = "continuum-evidence gains the additive SigningCustodyState value, the SigningCustody trait, CustodyWrite, the commit-point split of a custody write (cr-33e464), and local_revocations, the peer keys an operator revoked locally (cr-33e464 round 4); no existing encoding, signature, standing rule, or verdict changes. continuumd's install now owns only the held key when no custody state is restored, and continuum-security's keystore moves to a single atomically replaced state file, refusing a store of the unlaunched bn-1hape layout rather than reading it. Wire compatibility boundary: a daemon with durable custody refuses those four signing writes on a connection below 3.9 with UnsupportedSemanticFeature before anything changes, because no pre-3.9 code honestly reports an unknown outcome; a daemon without custody serves them at 3.8 unchanged. After an unconfirmed commit the daemon answers OutcomeUnknown, quarantines signing, and on relaunch validates whichever durable state survives"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-2qu5zr"
verdict = "approved"
