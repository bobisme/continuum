[semantic.claim_impact]
claims = []
reason = "no docs/18 claim row covers neighborhood generation; the neighborhood-adequacy frontier row (plan 24.5, research/33, quote-id neighborhood-adequacy-catch-rate) is graded on the docs/50 gaming corpus, which does not exist, and RFC 0032 makes no adequacy claim until it does, so this change claims coverage disclosure only"

[semantic.schemas]
updated = []
reason = "no schema document and no wire shape changes: the full neighborhood record is crate-local (continuum.repair.neighborhood/v0), and its receipt projection conforms to promotion-receipt.schema.json coverage.neighborhood as it stands (strategy tokens from neighborhood_strategy, explored/failing/truncated/frontier, failing_neighbors with a plan 4.4 handle), checked against the schema file by a test"

[semantic.migration]
verdict = "Preserved"
note = "continuum-repair was a scaffold with no types; it gains the neighborhood module and edges to continuum-intent and continuum-value. continuum-asupersync gains a dev edge to continuum-repair and an additive guided_log helper in its register test support; every existing register campaign, golden and digest is unchanged"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-3hfw5b"
verdict = "approved"
