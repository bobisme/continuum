[change]
bone = "bn-4ykgg"
author = "continuum-dev"
summary = "PR 21 semantic neighbor generation: continuum-repair's new neighborhood module generates gate-5 neighbors around a causal core along RFC 0032's closed strategy set (generic interleaving and message generators over any CausalCore, substrate hooks for fault placement, cancellation and value-domain edits), types every candidate against the Intent Contract's fault model and bounds before it can be realized, charges a candidate, run and work budget before the work and suspends as pending with a serialized continuation that resumes exactly, and records per-strategy coverage as canonical JSON whose promotion-receipt coverage.neighborhood projection is refused unless the campaign is complete"

