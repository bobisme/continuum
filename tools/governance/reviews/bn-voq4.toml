[change]
bone = "bn-voq4"
author = "continuum-dev"
summary = "continuum-engine-dpor: the RFC 0004 baseline reducer for finite safety — stateful persistent (stubborn-closure) sets over a footprint-derived conflict relation, sleep sets with visits keyed by (state, sleep set) and donation only once a label's strongly connected component is complete, observer visibility (INV-013), the stack proviso, typed INV-008 outcomes with charge-before-work bounds, a reduction witness, and an independent witness checker; C005 differential corpus and mutation campaign"

[semantic]
covers = [
  "crates/continuum-engine-dpor/src/",
]
reference_tests = [
  "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_bnd_01_a_bound_is_never_a_pass",
  "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_bnd_02_a_violation_inside_a_bound_is_genuine",
  "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_bnd_03_a_reachable_fault_is_an_engine_error",
  "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_bnd_04_an_unknown_predicate_is_refused",
  "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_reduced_runs_are_deterministic",
  "crates/continuum-engine-dpor/tests/c005_checker_independence.rs::the_checker_imports_only_the_shared_schema",
  "crates/continuum-engine-dpor/tests/c005_checker_independence.rs::the_checker_derives_its_own_footprints_and_components",
  "crates/continuum-engine-dpor/src/mutation.rs::every_seeded_fault_is_caught_by_the_differential",
  "crates/continuum-engine-dpor/src/mutation.rs::the_sound_reducer_passes_the_same_campaign",
  "crates/continuum-engine-dpor/src/checker_tests.rs::a_stubborn_set_that_is_not_closed_is_rejected",
  "crates/continuum-engine-dpor/src/checker_tests.rs::a_donation_inside_a_component_is_rejected",
  "crates/continuum-engine-dpor/src/checker_tests.rs::a_cycle_without_a_full_visit_is_rejected",
  "crates/continuum-engine-dpor/src/checker_tests.rs::an_unjustified_sleep_member_is_rejected",
  "crates/continuum-engine-dpor/src/bits.rs::set_algebra_matches_a_reference_set",
  "crates/continuum-engine-dpor/src/checker_tests.rs::a_huge_outcome_fanout_is_refused_before_any_proportional_work",
  "crates/continuum-engine-dpor/src/checker_tests.rs::the_exact_work_boundary_grows_with_the_outcome_count",
  "crates/continuum-engine-dpor/src/checker_tests.rs::a_huge_witness_list_is_refused_before_it_is_read",
  "crates/continuum-engine-dpor/src/checker_tests.rs::no_accepted_witness_touches_more_than_it_paid",
  "crates/continuum-engine-dpor/src/checker_tests.rs::an_out_of_range_edge_label_is_dangling_under_any_budget",
  "crates/continuum-engine-dpor/src/checker_tests.rs::the_stubborn_table_is_paid_before_it_is_built_even_for_all_full_witnesses",
  "crates/continuum-engine-dpor/src/checker_tests.rs::every_donation_search_is_paid_before_the_insert",
  "crates/continuum-engine-dpor/src/mutation.rs::obligations_are_reserved_before_any_is_read",
  "crates/continuum-engine-dpor/src/mutation.rs::every_state_index_search_is_paid",
  "crates/continuum-engine-dpor/src/mutation.rs::the_proviso_collection_is_paid_before_it_is_built",
