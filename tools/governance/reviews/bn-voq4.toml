metamorphic_tests = [
  { test = "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_alpha_renaming_preserves_every_verdict_and_projection", relation = "alpha-renaming" },
]
differential_tests = [
  { test = "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_exhaustive_differential_corpus", oracle = "continuum-engine-reference", subject = "continuum-engine-dpor" },
]

[semantic.claim_impact]
claims = ["C005"]
reason = "this change is C005's evidence: the reducer and its differential corpus against the unreduced reference engine (1013 models under two obligation scopes; on the 969 that do not fault, every one of 5391 verdicts including 652 RFC 0003 undefined-read outcomes, the visible projections, the terminal states under both completion policies and 2847 counterexample and undefined-read paths agree, and every witness is accepted by the independent checker; on the 44 that fault, both engines report an engine error and the reduced fault is one of the reachable faults an unreduced walk finds) and a mutation campaign in which each of six seeded reducer faults is caught; docs/18 C005 moves from TARGET to OBSERVED scoped to that corpus, with the claims-baseline revision naming bn-voq4"

[semantic.schemas]
updated = []
reason = "no schema document moves: the report, the reduction witness and the checker's result are in-process Rust types of a crate that had no public API before, no daemon operation or wire artifact carries them yet, and no source here names a schema class URI"

[semantic.migration]
verdict = "Preserved"
note = "continuum-engine-dpor was a documented stub with no items; check, check_witness, dependence, OBLIGATION_UNITS, CheckError::WorkBelowObligations and every type are new surface, so no caller of any crate changes and no stored artifact is re-derived; the crate's one new normal edge is continuum-model-core, and its dev edges (continuum-engine-reference, continuum-cml-elab) are recorded in dependency-rationale.toml"

[por_reduction]
covers = [
  "crates/continuum-engine-dpor/src/",
]
no_reduction_tests = [
  { test = "crates/continuum-engine-dpor/tests/c005_differential.rs::c005_exhaustive_differential_corpus", oracle = "continuum-engine-reference", subject = "continuum-engine-dpor" },
]
dependence_mutation_tests = [
  "crates/continuum-engine-dpor/src/mutation.rs::every_seeded_fault_is_caught_by_the_differential",
]

[por_reduction.property_analysis]
tier = "Tier A"
note = "continuum-engine-dpor reduces for Tier A only: finite-state invariants and the deadlock question. Visibility is the read footprint of the invariants and of every definedness predicate the check consults (RFC 0003: each invariant's chain and every action's chain), so every reachable visible valuation, every reachable deadlock and the existence of a reachable evaluation fault is preserved under persistent sets, component-closed sleep sets and the stack proviso; the crate has no liveness entry point, so no safety reduction is reused for Tier B or C (RFC 0004 'Fairness and liveness interaction')"

[por_reduction.performance]
metric = "explored executions/configurations"
note = "continuum-engine-dpor on the C005 corpus: 21018 stored states against the unreduced reference engine's 27111 on the 957 non-faulted generated models (fewer on 375; 20258 under the first invariant alone), 60 against 182 on the eight non-faulted adversarial models, and no reduction on the four dossier models, whose invariants read every variable; on the generated models the reducer fires 36551 labels where the oracle has 59015 state-changing (action, target) steps, two counts of different units. Wall time and memory are not measured here"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-1wuzry"
verdict = "approved"
