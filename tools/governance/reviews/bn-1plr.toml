[semantic.claim_impact]
claims = ["C033"]
reason = "The row's state and wording do not change. C033 stays TARGET: the receipt's decision is now recomputed from the record and the recomputed diff's classification and checked, but no receipt verifies, because no evaluation records gates 2, 3 and 5-11, no program-side classifier exists, gate 8 has no refinement evidence under any profile, and repair.promote is not served (bn-23pwm)"

[semantic.schemas]
updated = []
reason = "no schema document changes: the crate fills the epoch-1 receipt's existing optional policy_decision enum (allow, review, block) with the recomputed verdict's decision, omits it for an inconclusive verdict, and requires it on a claim as RFC 0032 correction 11 does; validate_dossier.py checks the two new retained fragments against the schema's own property subschemas"
unaffected = { promotion-receipt = "policy_decision is rendered only as one of the schema's three tokens, or omitted; no other field changes", repair-transaction = "read only: gate statuses are read from the transaction record, whose shape does not change; policy_verdict stays unwritten", semantic-diff = "the RFC 0031 decision is read as a value through the existing IntentClassification seam, never produced here" }

[semantic.migration]
verdict = "Revalidate"
note = "continuum-repair: verify_skeleton and verify_for_promotion take one more argument after IMPL-03's ImpactScope, a GateReasons store (reasons of inconclusive gates only); ClaimedReceipt now requires policy_decision; SkeletonVerification and ReceiptGenerationLicense carry the ReceiptDecision; ReceiptSeam loses PolicyDecision and ReceiptField gains it; VerifyRefusal gains PolicyDecision. A claim on a version that is not a classified PromoteEligible is now refused by the policy step, with the recomputation, before the per-gate record comparison, IMPL-03's gate-3 check and the unknowns comparison (previously GateNotOnRecord at the first pending gate, or IntentIntegrityNotDerived). No daemon path calls this module, and no wire shape, IDL operation or rt_ identity changes"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-vozpm6"
verdict = "approved"
