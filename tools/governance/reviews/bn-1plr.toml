[change]
bone = "bn-1plr"
author = "continuum-dev"
summary = "PR-22 / IMPL-09, policy decision: continuum-repair's receipt::policy module computes the receipt's policy_decision inside verify_for_promotion and verify_skeleton from the named rt_ version's recorded gates, through the PR-20 IMPL-06 PolicyVerdict, and the classification of the diff the receipt recomputes from the stores for that version (IMPL-03), per RFC 0032 Promotion step 2. The caller supplies only gate reasons (GateReasons), never a verdict, decision or classification: ReceiptDecision::derive is crate-private, of_skeleton recomputes from a composed skeleton, and compile-fail doctests show a held PolicyVerdict cannot be offered. ReceiptClassification is Bound(allow) for a classified repair, Bound(review or block) for a privileged intent revision, Absent for an undiffable or unclassified diff, which never supports allow. The field is allow only for a classified PromoteEligible, block for Blocked, the RFC 0031 join for PrivilegedIntentRevisionRequired, absent otherwise. A claim must carry policy_decision (Missing/Malformed); a claim that is not the recomputed field is Disagrees and an agreeing non-promotable one NotPromotable, each carrying the recomputation with failed gates, each undecided gate's typed INV-008 reason and the classification. The check runs before the per-gate record comparison, after a gate-12-already-passed refusal at promotion, so no licence exists unless the version is a classified PromoteEligible under the current stores; ReceiptSeam::PolicyDecision becomes ReceiptField::PolicyDecision"

