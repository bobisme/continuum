metamorphic_tests = [
  { test = "crates/continuum-task/tests/region_abort_and_slots.rs::symmetry_renaming_of_slots_preserves_the_run", relation = "symmetry renaming" },
  { test = "crates/continuum-task/tests/region_abort_and_slots.rs::independent_event_swap_of_two_slot_resolutions_preserves_the_render", relation = "independent-event swap" },
]
differential_tests = [
  { test = "crates/continuumd/tests/region_staging_differential.rs::the_calculus_and_an_independent_reference_model_agree_on_every_staging_transition", oracle = "continuum-engine-reference", subject = "continuum-task" },
  { test = "crates/continuumd/tests/region_staging_differential.rs::a_mutated_reference_guard_is_told_apart", oracle = "continuum-engine-reference", subject = "continuum-task" },
]

[semantic.claim_impact]
claims = ["C004", "C023"]
reason = "C004 (the asupersync adapter captures all supported nondeterminism) and C023 (the triptych's A7 arrow, whose conformance model found the explicit-abort, multi-reservation and parallel-ledger lift gaps) both depend on the calculus admitting what the substrate does. This change gives the calculus those steps and the ledger entry point, and promotes neither claim: the continuum-asupersync lift does not adopt them yet (follow-up), so no docs/18 row changes state or wording"

[semantic.schemas]
updated = []
reason = "no schema document changes: the region calculus is in-process typed code with no wire schema, the protocol and IDL do not move, and the canonical renders of every run that stages at most one publication at a time are byte-identical to before, because the primary slot's obligation keeps its worker-keyed subject"

[semantic.migration]
verdict = "Preserved"
note = "continuum-task: every existing step keeps its meaning and its refusals, so every existing schedule, render and test is unchanged; the public enums WorkerStep, RegionFault, ObligationKind, Subject, schedule::Step and StepOutcome gain variants, and EvidenceLedger now counts staged publications (is_provisional is staged > 0). In-workspace callers (continuumd, continuum-asupersync) compile unchanged and match none of these enums exhaustively"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-1ckhmw"
verdict = "approved"
