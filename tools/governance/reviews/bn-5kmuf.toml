[semantic.claim_impact]
claims = []
reason = "no docs/18 claim row covers causal minimization or causal cores; the causal-minimization frontier row (plan 24.5, research/26, quote-id causal-minimization-core-ratio) is a register threshold this change measures again and does not meet: the composed M01 corpus median stays 31.5 percent of the original run, minimum 27.3 percent (was 28.5), maximum 69.2 percent, provisional per the register owner's 2026-09-25 ruling on bn-2nh6"

[semantic.schemas]
updated = []
reason = "no JSON schema document and no wire shape changes. OwnerMinimal, FaultMinimal and ValueMinimal now mean minimal among mechanism-preserving configurations: a candidate that fails only through another mechanism is recorded as MechanismLost and, when the scenario tried every run of it, does not refute the class; the token set is unchanged. The mechanism check is an in-process library with no production caller; failure.minimize stays unserved (bn-3ncgl), and crashpack.minimization and the context-pack guarantee enum are untouched (no new guarantee token; RFC 0028 F6 and F8 remain open)"

[semantic.migration]
verdict = "Revalidate"
note = "continuum-debugger's closure_pass, deletion_pass, minimize and reduce_scenario gain a validator argument (source-breaking for every caller, all in tests, all updated); Reduction::Reduced holds a Validated core, Reduction gains Rejected, Inconclusive's best is a Checked core, the scenario gains ConfigVerdict::MechanismLost, ScenarioReduction::Rejected, DimensionRecord::mechanism_lost and Scenario::search_exhausted, and Budget gains a validation allowance with a default. The passes' candidates and spending do not change (the checks draw on the separate allowance): the bn-3km4z and bn-2z08o goldens are byte-identical and the bn-25z9o transcripts too. The bn-25z9o corpus evidence is re-validated and corrected: 27 of 400 runs change (24 by configuration, 3 by schedule), the median stays 31.5 percent. continuum-asupersync's src is unchanged"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-2lnu3c"
verdict = "approved"
