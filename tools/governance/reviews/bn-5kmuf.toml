[change]
bone = "bn-5kmuf"
author = "continuum-dev"
summary = "PR 18 replay validation: continuum-debugger gains a mechanism module that defines a failure's causal mechanism (labelled steps, happens-before and replay-order edges, and guards that state an absence, derived from the original failure's witnesses) and checks that a result's own replay embeds it, with typed rejections and INV-008 inconclusives. Every public reduction entry point (closure_pass, deletion_pass, minimize, reduce_scenario) now takes a validator, checks the input and each pass's result, and returns a core only as Validated, which only the check constructs; the scenario keeps a candidate only when the check preserves its failing run, which corrects bn-25z9o's any-chain acceptance on 31 corpus runs. Every derived mechanism is bound to its acknowledgement's epoch (cr-2lnu3c th-2q3qcy): each step and guard label carries that epoch, a label of another epoch neither satisfies a step nor ends or breaks a guard, because the durable register keeps one slot per replica and epoch, and a label with no epoch or a dropped one never matches"

