[semantic.claim_impact]
claims = ["C033"]
reason = "The row's state and wording do not change. C033 stays TARGET: the verdict is computed over the gates a version records, but only gates 1 and 4 have an evaluation, the verdict is not written into the transaction artifact, and no repair is promoted because repair.promote is not served (bn-23pwm)"

[semantic.schemas]
updated = []
reason = "no schema document changes: the verdict is not written into the repair-transaction artifact (policy_verdict stays omitted, status derivation is unchanged), and its wire decision reuses the IDL's closed PolicyDecision (allow, review, block) through continuum-intent's existing type"
unaffected = { repair-transaction = "no field is written that was not written before; every IMPL-01, IMPL-02 and IMPL-03 artifact and rt_ identity is byte-identical", promotion-receipt = "receipt.rs is untouched; policy_decision on the receipt stays PR-22 / IMPL-09's", semantic-diff = "the RFC 0031 decision is read as a value, never produced here" }

[semantic.migration]
verdict = "Preserved"
note = "continuum-repair only. No published artifact, schema class or epoch moves, and no rt_ identity changes. The crate API gains the policy module (decide, Verdict, PolicyVerdict, VerdictClaim, GateReasons, ReplayRecords, IntentClassification, ContinueAndDiscloseGrant, authorize_continue_and_disclose). replay::request_continue_and_disclose keeps its signature and answer (NoAuthority) and now delegates to the policy layer; EvidenceRecord gains a crate-private statement reader used only by ReplayRecords; RepairTransaction gains a cfg(test) helper, with_recorded_gates_evidenced"

[semantic.security_review]
reviewer = "continuum-security"
review = "cr-1xggqg"
verdict = "approved"
