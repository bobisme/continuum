[change]
bone = "bn-b6u4"
author = "continuum-dev"
summary = "PR-20 / IMPL-06, policy verdict: continuum-repair's policy module computes a typed verdict from a transaction version's recorded gate statuses under its gate profile, never a bool. PromoteEligible (allow) only when every gate 1-11 of the profile passed (gate 12 is the promotion step); Blocked (block) on any failed gate with every failed and undecided gate named, failure dominating inconclusiveness; Inconclusive (no PolicyDecision) naming each pending gate and each inconclusive gate with the typed INV-008 reason its cited evidence records, or its typed absence; PrivilegedIntentRevisionRequired when gate 3 failed or a bound RFC 0031 classification is review or block, whatever the other gates say, with the RFC 0031 join (block for any failed gate) as its decision. Inadmissible gate lists, and a gate 1-11 passed on no evidence, are refused. PolicyVerdict binds the rt_ handle and identity bytes, is refused for any other version, and recheck refuses a claimed decision that the recomputation does not carry. The policy layer is the only issuer of a ContinueAndDisclose PolicyAuthorization, on a grant type with no values, so request_continue_and_disclose delegates to it and still answers NoAuthority (decision owned by bn-2vanm)"

