[semantic.claim_impact]
claims = ["C005", "C006", "C018", "C023"]
reason = "The harness's lane table names these four claims as the ones a cross-engine disagreement halts: C006 (closure oracle and the future explicit engine against the reference explorer), C018 and C023 (the kernel deciding the reference's certificates from wire bytes), C005 (the tiny exhaustive oracle and the future DPOR engine). The seeded corpus shows no disagreement on any lane that runs, so no claim is quarantined and no row changes state or wording; the committed register is empty. The explicit and DPOR slots report absent, so this change adds no evidence for C005 and none for an optimized engine under C006."

[semantic.schemas]
updated = []
reason = "no schema document changes, and none is invented: notes/plan/schemas/ has no defect_* document (the IDL declares only DefectHandle) and no claim-quarantine document, so the defect report is a harness-local canonical text hashed to its defect_ handle and the quarantine register is a harness-local line format, both stated in the module documentation and to be projected onto a schema when one lands"

[semantic.migration]
verdict = "Preserved"
note = "continuum-corpus was a documentation-only scaffold; the differential module is new surface with no prior artifact to migrate. No other crate's code changed: the engine and kernel adapters are this crate's test code over dev edges, and no release binary links the crate (tests/oracle_tooling_is_test_only.rs)."

