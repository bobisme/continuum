# --- producer: continuum-model-core (the canonical model encoding) ---------------
#
# At wire epoch 2 the emitter writes no initial states and no domain of its own: both
# are part of the carried model, written by `Model::identity`. bn-2npu's
# emit-drops-first-initial-state and emit-widens-the-domain therefore move here.

[[mutant]]
id = "identity-drops-first-initial-state"
side = "producer"
file = "crates/continuum-model-core/src/identity.rs"
targets = "encoding: every initial state of the model is written"
find = """        count(&mut out, self.initial_states().len());
        for state in self.initial_states() {"""
replace = """        let skip = usize::from(self.initial_states().len() > 1);
        count(&mut out, self.initial_states().len() - skip);
        for state in self.initial_states().iter().skip(skip) {"""
expect = "missed"
reason = "The kernel checks Init(M) ⊆ S for the model the certificate carries. The encoding is that model's identity (ADR-0013), so an encoder that drops content defines another model, consistently, and the certificate is true of it. Whether the carried model is the caller's is envelope-digest-binding, a trusted component: a caller comparing identities with the same encoder cannot see this."

[[mutant]]
id = "identity-widens-the-domain"
side = "producer"
file = "crates/continuum-model-core/src/identity.rs"
targets = "encoding: the declared domain is the model's"
find = "            out.extend_from_slice(&variable.domain().hi().to_be_bytes());"
replace = "            out.extend_from_slice(&variable.domain().hi().saturating_add(1).to_be_bytes());"
expect = "missed"
reason = "As identity-drops-first-initial-state: the carried model has a wider domain, every reachable state and every update stay inside it, and the certificate is true of the carried model. The binding of the carried model to the caller's is envelope-digest-binding."

[[mutant]]
id = "identity-writes-sub-as-add"
side = "producer"
file = "crates/continuum-model-core/src/identity.rs"
targets = "encoding: an operator is written as itself"
find = "                ArithOp::Sub => 1,"
replace = "                ArithOp::Sub => 0,"
expect = "caught"

