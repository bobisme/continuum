# C018 source mutants (bn-2npu).
#
# `tools/check_tcb_audit.py --evidence` applies each mutant, one at a time, to a
# scratch copy of the checking base and the reference producer, then runs a real
# Rust test target over the mutated code:
#
#   side = "checker"   ->  continuum-certificate --test c018_checker_mutation
#   side = "producer"  ->  continuum-engine-reference --test c018_producer_corpus
#
# `find` must occur exactly once in `file`. The gate checks that against the live
# tree, so a source edit that moves a mutant's target fails `just covenant` until
# this file is updated and the evidence is regenerated.
#
# `expect` is the claim the campaign makes about the mutant. The gate compares it
# with the recorded outcome:
#
#   checker:  killed    - at least one test of the target fails
#             survives  - no test fails; `reason` must say why that is acceptable
#   producer: caught    - the kernel rejects a changed certificate
#             missed    - a changed certificate still verifies; `reason` names the
#                         trusted component that let it through
#             refused   - the producer errors before the kernel is asked
#             no-effect - no certificate of the corpus changes

schema = "continuum.tcb-audit.mutants/1"

