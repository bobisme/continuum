replace = "    while let Some((here, depth)) = queue.pop_front().filter(|(_, d)| *d < 2) {"
expect = "refused"
reason = "The wire-epoch-2 emitter names each target by its index in the explored set, so a successor missing from the set is its own NotClosed error before any bytes exist. The kernel would reject the same set with successor-not-in-table: its re-derivation locates every successor itself (bn-35y4f)."

