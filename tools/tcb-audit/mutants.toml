# --- checker: continuum-kernel-temporal ----------------------------------------

[[mutant]]
id = "tmp-rank-decrease-off"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "ranking: every step decreases the rank"
find = "if target_rank >= rank {"
replace = "if false && target_rank >= rank {"
expect = "killed"

[[mutant]]
id = "tmp-ranking-dead-end-off"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "ranking: a non-goal state has a successor"
find = """        if targets.is_empty() {
            return Err(Rejection::ProgressDeadlock { state: index });"""
replace = """        if false && targets.is_empty() {
            return Err(Rejection::ProgressDeadlock { state: index });"""
expect = "killed"

[[mutant]]
id = "tmp-goal-rank-off"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "ranking: goal states rank zero"
find = "if rank != 0 {"
replace = "if false && rank != 0 {"
