[[mutant]]
id = "tmp-revert-bn-2npu-dead-end-fix"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "fair-SCC exclusion: a reachable non-goal dead end refutes (the defect bn-2npu fixed)"
find = """            if let Some(state) = stuck_state(&common.successors, &in_scope) {
                return Verdict::Rejected(Rejection::ProgressDeadlock { state });
            }"""
replace = """            let _ = stuck_state;"""
