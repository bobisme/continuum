# C018 source mutants (bn-2npu).
#
# `tools/check_tcb_audit.py --evidence` applies each mutant, one at a time, to a
# scratch copy of the checking base and the reference producer, then runs a real
# Rust test target over the mutated code:
#
#   side = "checker"   ->  continuum-certificate --test c018_checker_mutation
#   side = "producer"  ->  continuum-engine-reference --test c018_producer_corpus
#
# `find` must occur exactly once in `file`. The gate checks that against the live
# tree, so a source edit that moves a mutant's target fails `just covenant` until
# this file is updated and the evidence is regenerated.
#
# `expect` is the claim the campaign makes about the mutant. The gate compares it
# with the recorded outcome:
#
#   checker:  killed    - at least one test of the target fails
#             survives  - no test fails; `reason` must say why that is acceptable
#   producer: caught    - the kernel rejects a changed certificate
#             missed    - a changed certificate still verifies; `reason` names the
#                         trusted component that let it through
#             refused   - the producer errors before the kernel is asked
#             no-effect - no certificate of the corpus changes

schema = "continuum.tcb-audit.mutants/1"

# --- checker: continuum-kernel-core --------------------------------------------

[[mutant]]
id = "core-closure-rule-off"
side = "checker"
file = "crates/continuum-kernel-core/src/check.rs"
targets = "Post(S) ⊆ S"
find = "if body.table().position(transition.target()).is_none() {"
replace = "if false && body.table().position(transition.target()).is_none() {"
expect = "killed"

[[mutant]]
id = "core-domain-rule-off"
side = "checker"
file = "crates/continuum-kernel-core/src/check.rs"
targets = "S ⊆ P"
find = "if !variable.admits(*value) {"
replace = "if false && !variable.admits(*value) {"
expect = "killed"

[[mutant]]
id = "core-initial-rule-off"
side = "checker"
file = "crates/continuum-kernel-core/src/check.rs"
targets = "Init ⊆ S"
find = "if body.table().position(state).is_none() {"
replace = "if false && body.table().position(state).is_none() {"
expect = "killed"

[[mutant]]
id = "core-action-bound-off-by-one"
side = "checker"
file = "crates/continuum-kernel-core/src/check.rs"
targets = "every transition names a declared action (boundary)"
find = "if u32::from(transition.action()) >= action_count {"
replace = "if u32::from(transition.action()) > action_count {"
expect = "killed"

[[mutant]]
id = "core-decoder-accepts-unsorted-table"
side = "checker"
file = "crates/continuum-kernel-core/src/wire.rs"
targets = "canonicity: a strictly ascending state table"
find = "(Some(before), Some(here)) => before < here,"
replace = "(Some(before), Some(here)) => before != here,"
expect = "killed"

[[mutant]]
id = "core-decoder-accepts-trailing-bytes"
side = "checker"
file = "crates/continuum-kernel-core/src/wire.rs"
targets = "canonicity: no trailing bytes"
find = """    if !reader.is_empty() {
        return Err(DecodeFailure::Rejected(Rejection::TrailingBytes {"""
replace = """    if false && !reader.is_empty() {
        return Err(DecodeFailure::Rejected(Rejection::TrailingBytes {"""
expect = "killed"

[[mutant]]
id = "core-lookup-ignores-arity"
side = "checker"
file = "crates/continuum-kernel-core/src/wire.rs"
targets = "state lookup: a vector of the wrong arity is never a member"
find = """    pub fn position(&self, state: &[i64]) -> Option<u32> {
        if state.len() != self.arity {
            return None;
        }"""
replace = """    pub fn position(&self, state: &[i64]) -> Option<u32> {"""
expect = "survives"
reason = "Every vector the decoder hands to `position` is read with the table's own arity, so no wire input reaches the guard. It is defence in depth. The kernel's own unit test of `position` kills this mutant, but the lane runs only the C018 target."

