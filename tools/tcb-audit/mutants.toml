[[mutant]]
id = "tmp-stuck-state-ignores-scope"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "fair-SCC exclusion: only reachable non-goal dead ends refute (the scope of the bn-2npu rule)"
find = "if targets.is_empty() && in_scope.get(index).copied().unwrap_or(false) {"
replace = "if targets.is_empty() {"
expect = "killed"

[[mutant]]
id = "tmp-reachability-walks-through-goals"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "fair-SCC exclusion: behaviour after a goal visit does not refute eventually-goal (cr-10mg1y)"
find = """        if common.goal.get(state as usize).copied().unwrap_or(false) {
            continue;
        }"""
replace = ""
expect = "killed"

[[mutant]]
id = "tmp-no-cycle-is-fair"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "fair-SCC exclusion: a fair cycle refutes"
find = """            let fair = carries_cycle(successors, in_scope, &component)
                && is_fair(body, successors, &membership, &component);"""
replace = """            let fair = carries_cycle(successors, in_scope, &component)
                && is_fair(body, successors, &membership, &component)
                && false;"""
expect = "killed"

[[mutant]]
id = "tmp-every-cycle-is-fair"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "weak fairness: a cycle that never takes an enabled fair action is not fair"
find = """        if !taken && !disabled {
            return false;"""
replace = """        if false && !taken && !disabled {
            return false;"""
expect = "killed"

[[mutant]]
id = "tmp-reachability-ignored"
side = "checker"
file = "crates/continuum-kernel-temporal/src/check.rs"
targets = "fair-SCC exclusion: only reachable cycles refute"
find = """        *flag = reachable.get(index).copied().unwrap_or(false)
            && !goal.get(index).copied().unwrap_or(false);"""
replace = """        *flag = !goal.get(index).copied().unwrap_or(false);"""
expect = "killed"

# --- checker: continuum-certificate (the router) --------------------------------

[[mutant]]
id = "router-matches-a-magic-prefix"
side = "checker"
file = "crates/continuum-certificate/src/family.rs"
targets = "routing: the full eight-byte magic names the family"
find = ".find(|family| family.magic() == *magic)"
replace = ".find(|family| family.magic().get(..4) == magic.get(..4))"
expect = "killed"

# --- producer: continuum-engine-reference (search) ------------------------------

[[mutant]]
id = "bfs-loses-first-discovery"
side = "producer"
file = "crates/continuum-engine-reference/src/bfs.rs"
targets = "search: every discovered state is kept"
find = "        for (target, action) in discovered {"
replace = "        for (target, action) in discovered.into_iter().skip(1) {"
expect = "caught"

[[mutant]]
id = "bfs-stops-at-depth-two"
side = "producer"
file = "crates/continuum-engine-reference/src/bfs.rs"
targets = "search: the walk runs until the queue is empty"
find = "    while let Some((here, depth)) = queue.pop_front() {"
replace = "    while let Some((here, depth)) = queue.pop_front().filter(|(_, d)| *d < 2) {"
expect = "caught"

# --- producer: continuum-engine-reference (emitter) -----------------------------

[[mutant]]
id = "emit-unsorted-table"
side = "producer"
file = "crates/continuum-engine-reference/src/certificate.rs"
targets = "emission: the table is written in order"
find = """    out.u32(state_count);
    for state in states {"""
replace = """    out.u32(state_count);
    for state in states.iter().rev() {"""
expect = "caught"

[[mutant]]
id = "emit-action-index-shift"
side = "producer"
file = "crates/continuum-engine-reference/src/certificate.rs"
targets = "emission: a transition names its own action"
find = """            out.u16(action_index(step, action_count)?);
            out.state(step.target());"""
replace = """            out.u16(action_index(step, action_count)?.saturating_add(1));
            out.state(step.target());"""
expect = "caught"

[[mutant]]
id = "emit-drops-first-initial-state"
side = "producer"
file = "crates/continuum-engine-reference/src/certificate.rs"
targets = "emission: every initial state of the model is written"
find = "    let initial = model.initial_states();"
replace = "    let initial = model.initial_states().get(1..).filter(|rest| !rest.is_empty()).unwrap_or(model.initial_states());"
expect = "missed"
reason = "The kernel checks Init ⊆ S for the initial states the certificate carries. Whether they are all of the model's is certificate-model-correspondence, a trusted component."

[[mutant]]
id = "emit-drops-first-transition-of-each-row"
side = "producer"
file = "crates/continuum-engine-reference/src/certificate.rs"
targets = "emission: every successor of a state is written"
find = "        let width = count_u32(Field::TransitionCount, row.len(), 0, MAX_STATES)?;"
replace = """        let row: Vec<Step> = row.into_iter().skip(1).collect();
        let width = count_u32(Field::TransitionCount, row.len(), 0, MAX_STATES)?;"""
expect = "missed"
reason = "A sub-relation of a closed relation is still closed. The kernel checks closure under the carried rows, not that they are the model's rows (certificate-model-correspondence)."

[[mutant]]
id = "emit-widens-the-domain"
side = "producer"
file = "crates/continuum-engine-reference/src/certificate.rs"
targets = "emission: the declared domain is the model's"
find = "        out.i64(variable.domain().hi());"
replace = "        out.i64(variable.domain().hi().saturating_add(1));"
expect = "missed"
reason = "The property P is the carried domain. A wider P is an easier S ⊆ P, and the binding of P to the property digest is envelope-digest-binding, a trusted component."

[[mutant]]
id = "emit-retargets-to-the-first-state"
side = "producer"
file = "crates/continuum-engine-reference/src/certificate.rs"
targets = "emission: a transition names its own target"
find = "            out.state(step.target());"
replace = "            out.state(states.first().unwrap_or(step.target()));"
expect = "missed"
reason = "Every table state is a member, so a wrong target inside the table keeps the set closed. Target fidelity is certificate-model-correspondence."

# --- producer: continuum-model-core (the successor evaluator) --------------------

[[mutant]]
id = "eval-skips-the-last-action"
side = "producer"
file = "crates/continuum-model-core/src/model.rs"
targets = "evaluation: every action is tried"
find = "        for action in 0..self.actions.len() {"
replace = "        for action in 0..self.actions.len().saturating_sub(1) {"
expect = "missed"
reason = "Search and emission share the evaluator, so the wrong relation is explored and certified consistently. The kernel never sees the model."

[[mutant]]
id = "eval-update-off-by-one"
side = "producer"
file = "crates/continuum-model-core/src/model.rs"
targets = "evaluation: an update writes the value it computed"
find = "                *slot = value;"
replace = "                *slot = if value > 0 { value - 1 } else { value };"
expect = "missed"
reason = "A consistent evaluator bug yields a closed, in-domain, wrong relation. The kernel checks the carried relation, not the model's."

[[mutant]]
id = "eval-frame-rule-broken"
side = "producer"
file = "crates/continuum-model-core/src/model.rs"
targets = "evaluation: unassigned variables keep their value"
find = "            let mut values = state.values.clone();"
replace = "            let mut values = vec![0; state.values.len()];"
expect = "missed"
reason = "As eval-update-off-by-one: the explorer and the emitter agree on a wrong relation."

[[mutant]]
id = "eval-guards-ignored"
side = "producer"
file = "crates/continuum-model-core/src/model.rs"
targets = "evaluation: a disabled action has no successor"
find = "        if !self.is_enabled(action, state)? {"
replace = "        if false && !self.is_enabled(action, state)? {"
expect = "refused"
reason = "`inc` at `x = 4` leaves the domain, and the evaluator reports UpdateOutOfDomain before any certificate exists. A guard bug that stays inside the domain would be missed like the other evaluator mutants."
