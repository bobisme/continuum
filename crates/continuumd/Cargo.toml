[package]
name = "continuumd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# One workspace edge, and RFC 0026 is the reason it is not optional:
#
#   `ProtocolEpoch::negotiate` is the typed form of this rule and `ProtocolWindow` of
#   the major window; the daemon and that module MUST agree.
#     -- RFC 0026, "Version window and negotiation"
#
# Two of the IDL's eight string aliases are already that crate's types: `ProtocolVersion`
# is `ProtocolEpoch` (whose parse/render round-trip *is* the IDL's
# `^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$`) and `EpochIdentity` is `EpochIdentity` (whose
# printable-ASCII rule *is* `^[!-~]+$`). Restating either here would be a second spelling
# of one identity, which is what ADR-0013 forbids. No external dependency is added.
#
# Two more arrived with the operation layer (`src/daemon`), and both are the crates the
# operations are *wiring*, not crates whose work is restated here:
#
# - `continuum-workspace` owns the snapshot model the `workspace` family operates on
#   (import, overlay, fork, seal, diff, staleness) and the publication/authorization
#   reference implementation RFC 0027's "Landed vocabulary" clause binds this daemon to.
#   The store-side `CapabilityDescriptor` is a documented *subset* of the wire one, so the
#   daemon holds the wire descriptor and derives the store's from it rather than keeping
#   two independent tables;
# - `continuum-intent` owns the Intent Contract, its canonical JSON, and the field-level
#   change policy the `intent` family enforces. INV-001 — ordinary operations cannot mutate
#   intent — is that crate's immutability plus this crate's admission predicate; a second
#   policy table here would be the second spelling ADR-0013 forbids.
#
# A fourth arrived with the `evidence` family:
#
# - `continuum-evidence` owns the plan §11.4 claim-status lattice and the plan §11.7
#   compare-and-set that decides "would this write lower the claim?". Its own module
#   documentation names this daemon as one of the two consumers that must share one
#   implementation of that predicate — "a checker that recomputed the order for itself
#   would be checking its own assumption" — so `evidence.verify`'s promotion calls
#   `compare_and_set` rather than restating the order here.
#
# All are "top of the dependency islands" crates and none depends on the daemon, so no
# cycle and no forbidden edge is created (`tools/check_crate_boundaries.py`).
#
# Repeated under [dev-dependencies] because integration tests in `tests/` are separate
# crates and do not inherit the library's dependencies.
[dependencies]
continuum-evidence = { path = "../continuum-evidence" }
continuum-intent = { path = "../continuum-intent" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }

[dev-dependencies]
continuum-evidence = { path = "../continuum-evidence" }
continuum-intent = { path = "../continuum-intent" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }

[lints]
workspace = true
