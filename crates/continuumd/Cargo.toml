[package]
name = "continuumd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# One workspace edge, and RFC 0026 is the reason it is not optional:
#
#   `ProtocolEpoch::negotiate` is the typed form of this rule and `ProtocolWindow` of
#   the major window; the daemon and that module MUST agree.
#     -- RFC 0026, "Version window and negotiation"
#
# Two of the IDL's eight string aliases are already that crate's types: `ProtocolVersion`
# is `ProtocolEpoch` (whose parse/render round-trip *is* the IDL's
# `^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$`) and `EpochIdentity` is `EpochIdentity` (whose
# printable-ASCII rule *is* `^[!-~]+$`). Restating either here would be a second spelling
# of one identity, which is what ADR-0013 forbids. No external dependency is added.
#
# Two more arrived with the operation layer (`src/daemon`), and both are the crates the
# operations are *wiring*, not crates whose work is restated here:
#
# - `continuum-workspace` owns the snapshot model the `workspace` family operates on
#   (import, overlay, fork, seal, diff, staleness) and the publication/authorization
#   reference implementation RFC 0027's "Landed vocabulary" clause binds this daemon to.
#   The store-side `CapabilityDescriptor` is a documented *subset* of the wire one, so the
#   daemon holds the wire descriptor and derives the store's from it rather than keeping
#   two independent tables;
# - `continuum-intent` owns the Intent Contract, its canonical JSON, and the field-level
#   change policy the `intent` family enforces. INV-001 — ordinary operations cannot mutate
#   intent — is that crate's immutability plus this crate's admission predicate; a second
#   policy table here would be the second spelling ADR-0013 forbids.
#
# A fourth arrived with the `evidence` family:
#
# - `continuum-evidence` owns the plan §11.4 claim-status lattice and the plan §11.7
#   compare-and-set that decides "would this write lower the claim?". Its own module
#   documentation names this daemon as one of the two consumers that must share one
#   implementation of that predicate — "a checker that recomputed the order for itself
#   would be checking its own assumption" — so `evidence.verify`'s promotion calls
#   `compare_and_set` rather than restating the order here.
#
# All are "top of the dependency islands" crates and none depends on the daemon, so no
# cycle and no forbidden edge is created (`tools/check_crate_boundaries.py`).
#
# A fourth arrived with the `verification` family (`src/daemon/verification.rs`):
#
# - `continuum-engine-reference` is the exact finite model service PR 8 wraps "behind native
#   protocol", and plan §4.1 lists an "Engine orchestrator" among the things `continuumd` is
#   composed of. `verification.start` explores and checks through that crate and re-decides
#   none of it: the reachable set, the invariant and deadlock outcomes, the shortest witness
#   and the typed INV-008 reasons are its answers, projected onto the wire. The forbidden
#   engine edge is the *checker*'s — "the certificate checker may not depend on search"
#   (START_HERE, enforced as RULE certificate-checker-not-search) — and the daemon is on the
#   other side of it.
#
# A fifth arrived with the `evidence` family's certificate lane
# (`src/daemon/evidence.rs`, bn-dtg61):
#
# - `continuum-certificate` is the caller-facing certificate surface plan §20 declares, and
#   `evidence.verify` is the caller. A certificate-class evidence node references bytes an
#   untrusted producer wrote; the daemon hands them to `check_certificate` and reports the
#   routed kernel's own verdict, so `validated` is reachable only through a checker this
#   process does not implement and cannot influence (INV-004). The direction is the only one
#   plan §20 admits: its single rule about this crate constrains what *it* may depend on
#   ("proof/certificate checker does not depend on search engines"), and a consumer edge adds
#   nothing to its closure — `RULE certificate-checker-not-search` walks outward from
#   `continuum-certificate` and the four kernels, so `continuumd -> continuum-certificate`
#   cannot reach it. The daemon's own `continuum-engine-reference` edge stays on the far side
#   of that boundary for the same reason it always did: the forbidden edge is the checker's.
#   No decoder is duplicated here — the whole byte string, magic included, is passed through,
#   and this crate names no kernel wire type.
#
# A sixth arrived with PR 6's task-lifecycle rewiring (`src/daemon/region.rs`):
#
# - `continuum-task` owns the region calculus plan §20 gives it — "task lifecycle,
#   committed partial evidence, budget accounting, suspension/continuation, drain and
#   finalize behavior, and the guarantee of no orphan workers". START_HERE's PR 6 stem is
#   "use asupersync regions for daemon work", and daemon work is dispatched here, so the
#   daemon is the consumer that sentence names. Its own module documentation designs this
#   seam outright ("the PR 6 rewiring is a `TaskEntry` gaining a `RegionId` and
#   delegating"), and the edge runs in the only direction that keeps it: `continuum-task`
#   declares no `continuumd` dependency and mints no wire vocabulary — it spells RFC 0026's
#   six `TaskStatus` tokens through `WorkerState::status_token` precisely so the two crates
#   agree without either importing the other's protocol. No async runtime arrives with it:
#   that crate has no thread, clock, executor, or interior mutability, and its two edges are
#   `continuum-value` and `continuum-evidence`.
#
# A sixth arrived with PR-11 / IMPL-04's `context` family (`src/daemon/context.rs`):
#
# - `continuum-context` owns the Context Pack — RFC 0028's omission manifest, the closed
#   `ExpansionRelation` and `OmissionReason` vocabularies, the content-derived expansion
#   handle, and the child-document derivation an expansion answers with. `context.expand`
#   projects that crate's answers onto the wire and re-decides none of them: the manifest
#   the envelope carries is the child pack's own, the `ctx_*` the response names is the
#   handle that crate derives from the question, and the closed accounting that makes
#   INV-007 checkable lives there rather than here. The direction is the islands' —
#   `continuum-context` declares no `continuumd` edge and mints no wire vocabulary; its
#   eleven relation tokens and five omission reasons are transcribed from the IDL and the
#   schema, and `tests/daemon_context_operations.rs` holds the two spellings token for
#   token from this side, which is the only side that sees both.
#
# Repeated under [dev-dependencies] because integration tests in `tests/` are separate
# crates and do not inherit the library's dependencies.
[dependencies]
continuum-certificate = { path = "../continuum-certificate" }
continuum-context = { path = "../continuum-context" }
continuum-evidence = { path = "../continuum-evidence" }
continuum-engine-reference = { path = "../continuum-engine-reference" }
continuum-intent = { path = "../continuum-intent" }
continuum-task = { path = "../continuum-task" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }

[dev-dependencies]
continuum-certificate = { path = "../continuum-certificate" }
continuum-context = { path = "../continuum-context" }
continuum-evidence = { path = "../continuum-evidence" }
continuum-engine-reference = { path = "../continuum-engine-reference" }
continuum-intent = { path = "../continuum-intent" }
continuum-task = { path = "../continuum-task" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }

[lints]
workspace = true
