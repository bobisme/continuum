[package]
name = "continuum-cml-elab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
continuum-cml-syntax = { path = "../continuum-cml-syntax" }
# The programmatic model the elaborator lowers to: the same `Model` type the
# programmatic API builds (PR 15a). Plan §20: search consumes the model core, and so
# does a front end.
continuum-model-core = { path = "../continuum-model-core" }
# The run configuration (RFC 0003 "Configurations and bounds") is a JSON artifact
# (notes/plan/schemas/run-config.schema.json); it is read by the workspace's one strict
# canonical-JSON reader and its identity is that module's canonical encoding, rather
# than a second JSON reader or writer (ADR-0013).
continuum-intent = { path = "../continuum-intent" }

# The differential: `tests/diehard_differential.rs` checks the elaborated Die Hard
# model with the reference engine and compares every answer with the programmatic
# model's. Dev position only — a front end never ships against an engine
# (`tools/check_crate_boundaries.py:37-39`).
[dev-dependencies]
continuum-engine-reference = { path = "../continuum-engine-reference" }
# The claim-A certificate test checks the engine's wire-epoch-2 bytes with the kernel
# (bn-35y4f). Dev position only; the kernel links nothing back.
continuum-kernel-core = { path = "../continuum-kernel-core" }

[lints]
workspace = true
