
[package]
name = "continuum-asupersync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Two workspace edges and one external one. `continuum-task` holds the region
# calculus the journal is lifted into (bn-2gk): conformance is checked against that
# specification, so the adapter depends on it and never the reverse. `continuum-value`
# holds the ADR-0013 digest seam the journal's identity uses. `asupersync` is the
# substrate itself, pinned and feature-trimmed in the root [workspace.dependencies];
# `src/binding.rs` drives its lab runtime for the lifecycle family. Both workspace
# edges are repeated under [dev-dependencies] because integration tests in `tests/`
# are separate crates.
[dependencies]
asupersync.workspace = true
continuum-task = { path = "../continuum-task" }
continuum-value = { path = "../continuum-value" }

[dev-dependencies]
# PR 18 (bn-3km4z): the causal minimization passes, instantiated on the register's
# journals in `tests/pr18_impl01_reduction.rs`. A test edge only: the adapter's library
# does not depend on the debugger.
continuum-debugger = { path = "../continuum-debugger" }
# PR 15's exit evidence (bn-jw7q): `tests/pr15_exit_evidence.rs` drives the network,
# process and storage packs' Lab handlers, reads the time pack's declared profile, and
# holds them beside the binding's crash and cancellation. Test edges only: the adapter's
# library does not depend on any effect pack, and the packs themselves stay free of
# dependencies (their `no_std` lane and INV-015 audit judge the packs' own manifests).
continuum-effects-network = { path = "../continuum-effects-network" }
continuum-effects-process = { path = "../continuum-effects-process" }
continuum-effects-storage = { path = "../continuum-effects-storage" }
continuum-effects-time = { path = "../continuum-effects-time" }
# PR-20 / IMPL-03 (bn-2pla): gates 1 and 4 of a repair transaction, exact replay,
# instantiated on M01's recorded failure in `tests/pr20_impl03_exact_replay.rs`. A test
# edge only: the adapter's library does not depend on the repair crate.
# PR 21 (bn-4ykgg) uses the same edge for gate 5's neighborhood generation on the
# register's causal core in `tests/pr21_impl01_neighborhood.rs`.
continuum-repair = { path = "../continuum-repair" }
continuum-task = { path = "../continuum-task" }
continuum-value = { path = "../continuum-value" }

[lints]
workspace = true
