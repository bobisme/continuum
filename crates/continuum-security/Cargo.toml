[package]
name = "continuum-security"
version.workspace = true
edition.workspace = true
# The keystore's exclusive store lock (bn-18w74) is `File::try_lock`, stable since 1.89:
# std's only safe lock, and this crate forbids `unsafe` and adds no dependency. So this
# crate's compatibility floor is 1.89, above the workspace's 1.85; the pinned toolchain
# (`rust-toolchain.toml`, 1.97.0) is the one every gate builds with.
rust-version = "1.89"
license.workspace = true
publish = false

# One workspace edge, and it exists so that the injection corpus does not restate a closed
# set the dossier already fixes:
#
# - `continuum-workspace` owns `ArtifactClass`, plan §4.4's nineteen artifact classes as a
#   closed enum. The corpus's acceptance criterion is "across every agent-readable artifact
#   class", which is only checkable against that enum — `injection::readability` classifies
#   each of the nineteen and the corpus's own suite fails if a class it calls readable has
#   no case. A second list here would be the second spelling ADR-0013 forbids, and it would
#   silently miss a class the plan adds.
#
# The direction is the islands': `continuum-workspace` declares no `continuum-security`
# edge, so no cycle and no forbidden edge is created, and nothing here imports an engine, an
# adapter, or `continuum-forge` (this crate's own boundary contract, `src/lib.rs`).
# Two more, for plan §18.6 signing sources (bn-1hape, ADR-0054):
#
# - `continuum-evidence` owns the signing library — `KeyEntropy`, `SigningRegistry`,
#   `LocalSigner` — that `entropy::OsEntropy` and `keystore::LocalKeystore` supply. The OS
#   source and the keystore live here, in a boundary crate, because ambient entropy and
#   filesystem access are this tier's job and never the semantic core's (INV-005,
#   ADR-0003). The edge runs boundary -> semantic core only; `tests/entropy_isolation.rs`
#   checks from the real manifests that no semantic-core crate reaches back here.
# - `continuum-value` for the canonical `Value` decoder the audit log is persisted in.
[dependencies]
continuum-evidence = { path = "../continuum-evidence" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }

[lints]
workspace = true
