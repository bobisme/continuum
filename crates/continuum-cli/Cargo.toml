[package]
name = "continuum-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# One workspace edge (bn-3tz60, PR-13 third command group).
#
# `continuumd` owns the native protocol — "there is no `continuum-protocol` crate; the
# native protocol lives in `continuumd`" (`START_HERE_IMPLEMENTATION.md`, "Dependency
# islands") — so this adapter speaks that wire rather than restating any of its envelope,
# codec, registry, or transport types, on the same reasoning `continuum-mcp`'s identical
# single edge gives. Plan §20's "adapters do not own semantic state" holds here as it does
# there: this crate caches no snapshot, task, or continuation of its own, and every fact a
# command prints was answered by a `Daemon` over an encoded frame in the same call.
[dependencies]
continuumd = { path = "../continuumd" }

# Integration tests in `tests/` are separate crates and do not inherit the library's
# dependencies (the same restatement `continuum-mcp/Cargo.toml` and
# `continuum-benchmark/Cargo.toml` carry for the identical reason). The four extra edges are
# fixture material — the Die Hard corpus model, the intent contract it runs under, the
# content-identity seam snapshot staging needs, and the protocol window the handshake
# negotiates inside — assembling one in-process deployment `tests/` drives over a real
# `LocalPair` boundary, exactly as `continuum-mcp/tests/typed_surface.rs` does. It is not
# imported from `continuum-benchmark`'s `Rig`: `continuum-mcp/tests/typed_surface.rs`'s own
# comment gives the reason this crate's tests give too — the fixture is duplicated locally
# because the crate that would supply a shared rig is the benchmark harness, and depending on
# it from here to save fixture lines would be a dev-dependency edge with no reciprocal one.
#
# A fifth arrived with bn-28jj (PR-11 / IMPL-04): `continuum-context` supplies the Context
# Pack a `context expand` fixture registers — the omission record, the expansion payload,
# and the source reference the payload retrieves. There is one Context Pack vocabulary in
# this workspace and a fixture that spelled a second one would be testing the renderer
# against a shape no daemon produces.
[dev-dependencies]
continuum-context = { path = "../continuum-context" }
continuum-engine-reference = { path = "../continuum-engine-reference" }
continuum-intent = { path = "../continuum-intent" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }
continuumd = { path = "../continuumd" }

[lints]
workspace = true
