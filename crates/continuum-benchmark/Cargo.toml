[package]
name = "continuum-benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Five workspace edges, and plan §19/§20 name every one of them.
#
# `continuum-benchmark` is a harness: "may depend on Forge and on verifier interfaces — it
# is a harness, not part of the verifier" (this crate's own module doc, from plan §20). It
# owns no semantic state and publishes no trusted evidence of its own, and none of these
# edges changes that — every fact the harness reports was answered by a daemon or derived
# from a corpus file.
#
# - `continuumd` is the surface under test. Both arms of the G0-DX-10 comparison drive one
#   daemon over one `LocalPair`, so the harness needs the daemon, the transport, and the
#   envelope vocabulary. The native protocol lives in `continuumd` and nowhere else
#   (`START_HERE_IMPLEMENTATION.md`, "Dependency islands").
# - `continuum-engine-reference` is where a `Model` is declared. Die Hard is already
#   declared there (`src/diehard.rs`); Dining Philosophers is declared *here*, in that
#   crate's vocabulary, because TV-007 is a Wave 1 corpus port and PR 8's scope was TV-009
#   — see `src/philosophers.rs` for why the model is the harness's and the vocabulary is
#   the engine's.
# - `continuum-workspace` owns `WorkspacePath` and the content-identity seam the rig stages
#   corpus files through; `continuum-intent` owns the Intent Contract the rig accepts before
#   any snapshot exists; `continuum-value` owns the protocol window the handshake negotiates
#   inside. All three are provisioning, which a deployment does out of band (IDL §7).
#
# What is deliberately *not* here is `continuum-mcp`. It is the surface this harness grades,
# and it is an adapter: plan §20's "adapters do not own semantic state" is enforced
# mechanically as "adapters are sinks in the workspace graph"
# (`tools/check_crate_boundaries.py`, RULE adapters-are-sinks), so no crate may take a
# normal dependency on it — including this one. The native arm is therefore wired in
# `tests/`, where a dev-dependency is reported by that checker rather than enforced, by its
# own documented design ("a differential test may legitimately link an engine it would never
# ship against"). `src/surface.rs` states what that costs and what stays in the library.
[dependencies]
continuum-engine-reference = { path = "../continuum-engine-reference" }
continuum-intent = { path = "../continuum-intent" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }
continuumd = { path = "../continuumd" }

# Repeated because integration tests in `tests/` are separate crates and do not inherit the
# library's dependencies. `continuum-mcp` appears only here: see above.
[dev-dependencies]
continuum-engine-reference = { path = "../continuum-engine-reference" }
continuum-intent = { path = "../continuum-intent" }
continuum-mcp = { path = "../continuum-mcp" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }
continuumd = { path = "../continuumd" }

[lints]
workspace = true
