[package]
name = "continuum-repair"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Two workspace edges, both for PR-20 / IMPL-01 (bn-2d70).
#
# - `continuum-intent`: the base intent is an `in_*` Intent Contract identity
#   (`IntentId`), and the transaction artifact is written in the one canonical JSON
#   spelling that crate owns (`canonical_json::Json`, RFC 0037 ID5). A second JSON
#   writer here would be the second spelling ADR-0013 exists to prevent.
# - `continuum-value`: the `rt_*` handle is a digest of the canonical preimage under
#   the `ContentHasher` seam; this crate makes no hash-vendor decision.
#
# One edge for PR-20 / IMPL-02 (bn-195b):
#
# - `continuum-workspace`: the candidate is a workspace snapshot sealed from base +
#   changes (RFC 0032), so it is built by that crate's Merkle `Snapshot` and ordering
#   contract. A second snapshot notion here would give one workspace two identities.
#
# One edge for PR-20 / IMPL-04 (bn-1b69):
#
# - `continuum-semantic-diff`: gate 3 decides on the RFC 0031 `diff_*` artifact, and
#   that crate's `assemble` is the one classification authority. A second classifier
#   here would give one revision pair two verdicts.
[dependencies]
continuum-intent = { path = "../continuum-intent" }
continuum-semantic-diff = { path = "../continuum-semantic-diff" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }

# Repeated because integration tests in `tests/` are separate crates and do not
# inherit the library's dependencies (`continuum-semantic-diff/Cargo.toml`'s precedent).
[dev-dependencies]
continuum-intent = { path = "../continuum-intent" }
continuum-semantic-diff = { path = "../continuum-semantic-diff" }
continuum-value = { path = "../continuum-value" }
continuum-workspace = { path = "../continuum-workspace" }
# Test-only, PR-22 / IMPL-06 (bn-yzu1): the differential test reads the storage pack's
# own declared unsupported cases, the vocabulary `receipt::unknowns::PackCase` must
# carry. The library does not link it.
continuum-effects-storage = { path = "../continuum-effects-storage" }

[lints]
workspace = true
