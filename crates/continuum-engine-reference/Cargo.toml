[package]
name = "continuum-engine-reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# One kernel edge, in dev position only, and it is the differential itself:
# `tests/certificate_kernel_differential.rs` feeds the certificate this crate emits to
# `continuum-kernel-core`'s checker and asserts the verdict. The library has no
# kernel dependency — `src/certificate.rs` writes the wire form from the documented
# grammar, so producer and checker share no codec (docs/03 §8) — and it must not gain
# a kernel edge: plan §20 puts a serialization boundary between every engine and the kernel.
#
# `tools/check_crate_boundaries.py` enforces the forbidden direction (the certificate
# checker may not depend on search) and states this one explicitly: "Normal and build
# dependencies are enforced; dev-dependencies are reported but not enforced, because a
# differential test may legitimately link an engine it would never ship against"
# (`tools/check_crate_boundaries.py:37-39`). Every closure walk in
# `tools/governance/check_code_policy.py` likewise reads only the `("normal", "build")`
# graph. `tools/governance/dependency-rationale.toml` carries the GOV-1-07 entry.
# The programmatic model lives in the model core (moved there by bn-ybq, PR 15a) so
# that the CML elaborator builds the same `Model` type without importing an engine.
# Search consumes the model core, never the other way round (plan §20).
[dependencies]
continuum-model-core = { path = "../continuum-model-core" }

[dev-dependencies]
continuum-kernel-core = { path = "../continuum-kernel-core" }

[lints]
workspace = true
